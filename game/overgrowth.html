<title>Overgrowth</title>

<style>
  /* Committed to a single dark world on purpose: the game is underlit, its
     corners go to actual black, and a light ground would fight every frame of
     it. The page is the cabinet the screen sits in. */
  :root {
    color-scheme: dark;
    --ground: #07070a;      /* near-black, faint blue bias — the void */
    --surface: #0d0d11;
    --hairline: #1c1c24;
    --ink: #d8d4c8;         /* the game's text colour */
    --ink-dim: #6e6e79;     /* cool-biased grey, not neutral */
    --ink-faint: #3a3a44;
    --grass: #6f9247;       /* the one accent: grass where it shouldn't be */
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--ground);
    color: var(--ink-dim);
    font: 400 13px/1.6 ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding: 28px 16px 36px;
    /* grass, bleeding up from under the building */
    background-image:
      radial-gradient(120% 60% at 50% 118%, rgba(111, 146, 71, 0.10), transparent 62%);
  }

  #wrap { width: 100%; max-width: 960px; }

  canvas#screen {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 16 / 9;
    image-rendering: pixelated;
    background: #000;
    border: 1px solid var(--hairline);
    box-shadow:
      0 0 0 1px rgba(0, 0, 0, 0.6),
      0 24px 60px -28px rgba(0, 0, 0, 0.95),
      0 0 90px -50px rgba(111, 146, 71, 0.5);
    touch-action: none;
    outline: none;
  }
  canvas#screen:focus-visible { border-color: var(--grass); }

  footer {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 7px 14px;
    max-width: 720px;
  }

  kbd {
    display: inline-block;
    min-width: 22px;
    padding: 3px 6px;
    border: 1px solid var(--hairline);
    border-bottom-width: 2px;
    border-radius: 3px;
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    font-size: 11px;
    line-height: 1.1;
    text-align: center;
  }

  .key { display: inline-flex; align-items: baseline; gap: 6px; white-space: nowrap; }
  .key span { font-size: 11px; letter-spacing: 0.06em; }

  .meta {
    display: flex;
    gap: 10px;
    align-items: center;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .meta b { color: var(--ink-dim); font-weight: 400; }

  #audio-note { color: var(--ink-faint); }
  #audio-note[data-on="1"] { color: var(--grass); }

  /* On a phone the screen is the whole point: give it the viewport and drop
     the furniture around it. The keyboard legend is meaningless on touch. */
  @media (max-width: 560px) {
    body { gap: 10px; padding: 8px 6px 12px; justify-content: flex-start; }
    #wrap { max-width: none; }
    canvas#screen { border-width: 0; box-shadow: none; }
    footer { display: none; }
  }
  @media (max-width: 560px) and (orientation: landscape) {
    body { padding: 0; gap: 0; justify-content: center; }
    canvas#screen { max-height: 100vh; width: auto; margin: 0 auto; }
    .meta { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>

<div id="wrap">
  <canvas id="screen" width="320" height="180" tabindex="0"
          aria-label="Overgrowth game screen"></canvas>
</div>

<footer>
  <span class="key"><kbd>&larr;</kbd><kbd>&uarr;</kbd><kbd>&darr;</kbd><kbd>&rarr;</kbd><span>move</span></span>

  <span class="key"><kbd>X</kbd><span>cancel</span></span>

</footer>

// ===== 10_engine.js ==============================================
// ---------------------------------------------------------------- engine
// Canvas, input, frame loop, and a small WebAudio synth. No assets: every
// pixel is drawn and every sound is generated at runtime, so the whole game
// is one self-contained file.

const W = 320, H = 180;
const cv = document.getElementById('screen');
const cx = cv.getContext('2d');
cx.imageSmoothingEnabled = false;

// --- input -------------------------------------------------------------
const KEYMAP = {
  ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
  w: 'up', s: 'down', a: 'left', d: 'right',
  W: 'up', S: 'down', A: 'left', D: 'right',
  z: 'ok', Z: 'ok', Enter: 'ok', ' ': 'ok',
  x: 'no', X: 'no', Escape: 'no', Backspace: 'no',
  c: 'menu', C: 'menu',
};
const held = {}, pressed = {}, consumed = {};

addEventListener('keydown', e => {
  const k = KEYMAP[e.key];
  if (!k) return;
  e.preventDefault();
  if (!held[k]) pressed[k] = true;
  held[k] = true;
});
addEventListener('keyup', e => {
  const k = KEYMAP[e.key];
  if (!k) return;
  e.preventDefault();
  held[k] = false;
});
addEventListener('blur', () => { for (const k in held) held[k] = false; });

const Input = {
  down: k => !!held[k],
  hit(k) { if (pressed[k] && !consumed[k]) { consumed[k] = true; return true; } return false; },
  // Held-with-repeat, for menus.
  repeat(k, state, delay = 0.28, rate = 0.08) {
    if (this.hit(k)) { state[k] = -delay; return true; }
    if (!held[k]) { state[k] = 0; return false; }
    state[k] = (state[k] || 0) + Time.dt;
    if (state[k] >= rate) { state[k] = 0; return true; }
    return false;
  },
  endFrame() { for (const k in pressed) { pressed[k] = false; consumed[k] = false; } },
};

// --- touch controls ----------------------------------------------------
// An on-screen pad and buttons, drawn into the game's own 320x180 frame so
// they scale with it and land where they look like they are. The previous
// scheme — drag the left half, tap the right half — had no cancel and no menu,
// so half the game was unreachable on a phone.
//
// Named TouchPad, not Touch: a top-level `const Touch` shadows the DOM's own
// Touch constructor for everything else in the global scope.
const TouchPad = {
  on: false,                 // overlay live; set from Options
  supported: ('ontouchstart' in window) || navigator.maxTouchPoints > 0,
  ids: {},                   // touch identifier -> which control it grabbed
  lit: {},                   // control -> seconds of highlight left
  // The last tap or click, in game coordinates, for screens that want to be
  // pressed directly rather than through the pad — the controls picker has to
  // work before the player has told us which controls they have.
  lastTap: null,
  takeTap() { const t = this.lastTap; this.lastTap = null; return t; },
  // Up the sides, not along the bottom. Every text box in this game is anchored
  // to the bottom edge, so a thumb pad down there sits on top of the words -
  // the move list was unreadable behind it. These positions clear the tallest
  // bottom box (the battle move list, y 118 down) and the HUD in the corner.
  padX: 32, padY: 90, padR: 27, dead: 7,
  buttons: [
    { k: 'ok',   x: 291, y: 100, r: 17, label: 'Z' },
    { k: 'no',   x: 291, y: 60,  r: 14, label: 'X' },
    { k: 'menu', x: 299, y: 24,  r: 12, label: 'C' },
  ],

  // Client space -> the game's 320x180 space, so a tap lands on what it hit.
  local(t) {
    const r = cv.getBoundingClientRect();
    return [(t.clientX - r.left) / r.width * W, (t.clientY - r.top) / r.height * H];
  },

  buttonAt(x, y) {
    for (const b of this.buttons) if (Math.hypot(x - b.x, y - b.y) <= b.r) return b;
    return null;
  },
  onPad(x, y) {
    return Math.abs(x - this.padX) <= this.padR && Math.abs(y - this.padY) <= this.padR;
  },

  // The pad is a stick, not four keys: direction comes from the offset, so
  // diagonals work and a thumb sliding around the pad keeps steering.
  steer(x, y) {
    const dx = x - this.padX, dy = y - this.padY;
    held.left = dx < -this.dead;  held.right = dx > this.dead;
    held.up = dy < -this.dead;    held.down = dy > this.dead;
    for (const k of ['left', 'right', 'up', 'down']) if (held[k]) this.lit[k] = 0.12;
  },
  release() { held.left = held.right = held.up = held.down = false; },

  // While a text box is up there is nothing to steer and one thing to do, so
  // the whole screen becomes the advance button. Every mobile RPG does this and
  // it is the difference between readable and infuriating.
  reading() {
    return (typeof Dialogue !== 'undefined' && Dialogue.active)
        || (typeof Game !== 'undefined' && Game.mode === 'cutscene')
        || (typeof Battle !== 'undefined' && Battle.active && Battle.state === 'message');
  },

  start(t) {
    const [x, y] = this.local(t);
    const b = this.buttonAt(x, y);
    if (b) {
      this.ids[t.identifier] = b.k;
      if (!held[b.k]) pressed[b.k] = true;
      held[b.k] = true;
      this.lit[b.k] = 0.16;
      return;
    }
    if (!this.reading() && this.onPad(x, y)) {
      this.ids[t.identifier] = 'pad'; this.steer(x, y); return;
    }
    if (this.reading()) {
      this.ids[t.identifier] = 'ok';
      if (!held.ok) pressed.ok = true;
      held.ok = true;
    }
  },
  move(t) {
    if (this.ids[t.identifier] !== 'pad') return;
    const [x, y] = this.local(t);
    this.steer(x, y);
  },
  end(t) {
    const which = this.ids[t.identifier];
    delete this.ids[t.identifier];
    if (!which) return;
    if (which === 'pad') this.release();
    else held[which] = false;
  },
  tick(dt) { for (const k in this.lit) this.lit[k] = Math.max(0, this.lit[k] - dt); },

  draw() {
    if (!this.on) return;
    // The picker asks which controls you want; showing them over the question
    // answers it for you.
    if (typeof Game !== 'undefined' && Game.mode === 'controls') return;
    const a = (k, base) => (this.lit[k] > 0 ? Math.min(1, base * 2.1) : base);
    // The pad is hidden while reading: it would sit on top of the text box, and
    // there is nothing to walk to anyway.
    // Every element is a light shape on its own dark plate. A single light
    // shape disappears against snow; a single dark one disappears in the
    // Gallery. Both together survive either.
    if (!this.reading()) {
      cx.globalAlpha = 0.42;
      circle(this.padX, this.padY, this.padR, '#0a0c12');
      cx.globalAlpha = 0.7;
      ring(this.padX, this.padY, this.padR, '#9aa1b2');
      const arms = [['up', 0, -1], ['down', 0, 1], ['left', -1, 0], ['right', 1, 0]];
      for (const [k, dx, dy] of arms) {
        const bx = this.padX + dx * 15, by = this.padY + dy * 15;
        const w = dy ? 14 : 8, h = dy ? 8 : 14;
        cx.globalAlpha = a(k, 0.55);
        rect(bx - w / 2 - 1, by - h / 2 - 1, w + 2, h + 2, '#0a0c12');
        cx.globalAlpha = a(k, 0.8);
        rect(bx - w / 2, by - h / 2, w, h, '#e6e8ee');
      }
    }
    for (const b of this.buttons) {
      if (this.reading() && b.k !== 'ok') continue;
      cx.globalAlpha = a(b.k, 0.42);
      circle(b.x, b.y, b.r, '#0a0c12');
      cx.globalAlpha = a(b.k, 0.72);
      ring(b.x, b.y, b.r, '#c8ccd8');
      cx.globalAlpha = a(b.k, 0.85);
      text(b.label, b.x - 2, b.y - 3, '#f0f2f6');
    }
    cx.globalAlpha = 1;
  },
};

cv.addEventListener('touchstart', e => {
  Audio_.unlock();
  // Recorded whether or not the overlay is live: a screen may want the raw tap.
  if (e.changedTouches[0]) TouchPad.lastTap = TouchPad.local(e.changedTouches[0]);
  if (!TouchPad.on) return;
  e.preventDefault();
  for (const t of e.changedTouches) TouchPad.start(t);
}, { passive: false });
// A mouse counts too, so the picker can be clicked on a desktop.
cv.addEventListener('pointerdown', e => {
  if (e.pointerType === 'touch') return;         // already handled above
  TouchPad.lastTap = TouchPad.local(e);
});
cv.addEventListener('touchmove', e => {
  if (!TouchPad.on) return;
  e.preventDefault();
  for (const t of e.changedTouches) TouchPad.move(t);
}, { passive: false });
for (const ev of ['touchend', 'touchcancel']) {
  cv.addEventListener(ev, e => {
    if (!TouchPad.on) return;
    e.preventDefault();
    for (const t of e.changedTouches) TouchPad.end(t);
  }, { passive: false });
}

// --- time --------------------------------------------------------------
const Time = { dt: 0, t: 0, frame: 0 };

// --- audio -------------------------------------------------------------
// Everything is oscillators and filtered noise. Town music is warm and
// slightly detuned; liminal rooms get a single sustained tone and a hum.
const Audio_ = {
  ac: null, master: null, musicGain: null, sfxGain: null,
  current: null, seq: null, seqStep: 0, seqTime: 0, drones: [],

  unlock() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ac = new AC();
    this.master = this.ac.createGain(); this.master.gain.value = 0.34;
    this.master.connect(this.ac.destination);
    this.musicGain = this.ac.createGain(); this.musicGain.gain.value = 0.5;
    this.musicGain.connect(this.master);
    this.sfxGain = this.ac.createGain(); this.sfxGain.gain.value = 0.9;
    this.sfxGain.connect(this.master);
    const note = document.getElementById('audio-note');
    if (note) { note.textContent = 'Sound on'; note.dataset.on = '1'; }
    if (this.pendingTrack) this.play(this.pendingTrack);
  },

  tone(freq, dur, { type = 'square', gain = 0.2, dest = null, detune = 0,
                    attack = 0.005, when = 0, vibrato = 0, decay = 0 } = {}) {
    if (!this.ac) return;
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type; o.frequency.value = freq; o.detune.value = detune;
    const now = this.ac.currentTime + when;
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(gain, now + attack);
    // A held note that only ramps down at the very end reads as an organ. A
    // short drop to a sustain level first is what makes it read as plucked,
    // which is most of the difference between this and the flat tone it was.
    if (decay > 0) {
      g.gain.exponentialRampToValueAtTime(gain * decay, now + attack + dur * 0.28);
    }
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    o.connect(g); g.connect(dest || this.sfxGain);
    // A slow, shallow wobble on the melody voice only. SNES leads almost never
    // sit perfectly still, and a perfectly still square is the sound of a
    // placeholder.
    if (vibrato) {
      const lfo = this.ac.createOscillator(), amt = this.ac.createGain();
      lfo.frequency.value = 5.2; amt.gain.value = vibrato;
      lfo.connect(amt); amt.connect(o.detune);
      lfo.start(now); lfo.stop(now + dur + 0.02);
    }
    o.start(now); o.stop(now + dur + 0.02);
  },

  // --- kit ---------------------------------------------------------------

    while (this.seqTime >= step) {

  // One eighth note, across every voice the track has. The four are deliberately
  // driven off the same counter rather than four sequencers: a melody that can
  // drift out of phase with its own bass line is worse than having no bass.

    // reason the old tracks sounded like a test tone rather than music.
    const late = (i % 2 === 1) ? (t.swing || 0) * step : 0;
    const bar = t.chordEvery || 8;

    if (t.lead) {
      const L = t.lead;
      const s = L.steps[i % L.steps.length];
      if (s !== null && s !== undefined) {
        this.tone(this.hz(s + (t.key || 0)), step * (L.legato || 1.7), {
          type: L.type || 'square', gain: L.gain || 0.055, dest: this.musicGain,
          detune: L.detune || 0, attack: 0.015, when: late,
          vibrato: L.vibrato || 0, decay: L.decay || 0,

    }

    if (t.chords) {
      const [root, quality] = t.chords[Math.floor(i / bar) % t.chords.length];
      const notes = CHORDS[quality] || CHORDS.maj;
      const at = i % bar;

      // rather than stamped.
      if (t.comp && t.comp[at % t.comp.length] === 'x') {
        notes.forEach((n, k) => this.tone(
          this.hz(root + n + (t.key || 0) - 12), step * (t.compLen || 0.9), {
            type: t.padType || 'square', gain: t.padGain || 0.018,
            dest: this.musicGain, attack: 0.012, when: late + k * 0.006, decay: 0.5,

      if (t.bassLine) {

        if (c !== '-') {
          // r root, 3 third, 5 fifth, 7 seventh, 8 the octave above.
          const deg = c === 'r' ? 0 : c === '3' ? notes[1] : c === '5' ? notes[2]

            type: t.bassType || 'triangle', gain: t.bassGain || 0.062,
            dest: this.musicGain, attack: 0.008, when: late, decay: 0.45,
          });
        }
      }
    }

    if (t.drums) {
      const d = t.drums[i % t.drums.length];
      if (d === 'k') this.kick(late, t.kickGain || 0.2);
      else if (d === 's') this.snare(late, t.snareGain || 0.11);
      else if (d === 'h') this.hat(late, t.hatGain || 0.03);
      else if (d === 'H') this.hat(late, (t.hatGain || 0.03) * 1.4, true);
      else if (d === 'K') { this.kick(late, t.kickGain || 0.2); this.hat(late, t.hatGain || 0.03); }

// --- frame loop --------------------------------------------------------
let lastT = performance.now();
function frame(now) {
  Time.dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now; Time.t += Time.dt; Time.frame++;
  Audio_.update(Time.dt);
  TouchPad.tick(Time.dt);
  Game.update(Time.dt);
  Game.draw();
  TouchPad.draw();
  Input.endFrame();
  requestAnimationFrame(frame);
}

const GLYPH_CACHE = {};
for (const ch in GLYPHS) GLYPH_CACHE[ch] = GLYPHS[ch].split(',');

function drawChar(ch, x, y, color) {
  const g = GLYPH_CACHE[ch] || GLYPH_CACHE['?'];
  cx.fillStyle = color;
  for (let r = 0; r < FONT_H; r++) {
    const row = g[r];
    for (let c = 0; c < FONT_W; c++) if (row[c] === '1') cx.fillRect(x + c, y + r, 1, 1);
  }
}

function text(str, x, y, color = '#e8e8ee', spacing = 1) {
  let cxp = x;
  for (const ch of String(str)) {
    if (ch !== ' ') drawChar(ch, cxp, y, color);
    cxp += FONT_W + spacing;
  }
  return cxp;
}

function textWidth(str, spacing = 1) { return String(str).length * (FONT_W + spacing) - spacing; }
function textCentered(str, cxPos, y, color, spacing = 1) {
  text(str, Math.round(cxPos - textWidth(str, spacing) / 2), y, color, spacing);
}

// Word-wraps to a pixel width, returning lines.
function wrap(str, maxPx, spacing = 1) {
  const words = String(str).split(' '), lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (textWidth(test, spacing) > maxPx && line) { lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

// --- drawing helpers ---------------------------------------------------
function rect(x, y, w, h, c) { cx.fillStyle = c; cx.fillRect(x | 0, y | 0, w | 0, h | 0); }

// Only the touch overlay uses these; everything in the world is rectangles.
function circle(x, y, r, c) {
  cx.fillStyle = c; cx.beginPath(); cx.arc(x, y, r, 0, Math.PI * 2); cx.fill();
}
function ring(x, y, r, c, w = 1) {
  cx.strokeStyle = c; cx.lineWidth = w;
  cx.beginPath(); cx.arc(x, y, r - w / 2, 0, Math.PI * 2); cx.stroke();
}

// Deterministic per-pixel noise, so texture never shimmers between frames.
//
// Multiplied through Math.imul, and shifted with >>> rather than >>. The plain
// `*` version this started as overflowed into a double, so the following shift
// truncated it and the result was uniform on [0, 0.5) - it could not return a
// value of 0.5 or above for any input at all. Every `hash2(...) > 0.5x` test in
// the game was therefore dead, and a lot of authored texture detail - rust
// streaks on the works, lit windows, shingle highlights - had never once been
// drawn. Mean is 0.4996 across a 400x400 grid now, deciles within 0.2%.
function hash2(x, y) {
  let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263)) | 0;
  h ^= 0x5bf03635;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.max(0, Math.min(255, ((n >> 16) & 255) + amt));
  const g = Math.max(0, Math.min(255, ((n >> 8) & 255) + amt));
  const b = Math.max(0, Math.min(255, (n & 255) + amt));
  return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
}

// --- sprites -----------------------------------------------------------
// SPR and PAL are generated by tools/gen_sprites.py into 15_sprites.js.
// Palette keys are base36 so a sprite can carry more than ten tones.

function sprite(name, x, y, pal, flip = false, alpha = 1) {
  const s = SPR[name]; if (!s) return;
  const p = PAL[pal] || PAL.player;
  if (alpha < 1) cx.globalAlpha = alpha;
  const w = s[0].length;
  for (let r = 0; r < s.length; r++) {
    for (let c = 0; c < w; c++) {
      const ch = s[r][c];
      if (ch === '.' || ch === ' ') continue;
      const col = p[ch]; if (!col) continue;
      cx.fillStyle = col;
      cx.fillRect((x + (flip ? w - 1 - c : c)) | 0, (y + r) | 0, 1, 1);
    }
  }
  if (alpha < 1) cx.globalAlpha = 1;
}

function spriteWidth(name) { return SPR[name] ? SPR[name][0].length : 0; }
function spriteHeight(name) { return SPR[name] ? SPR[name].length : 0; }

// --- lighting ----------------------------------------------------------
// One dominant source per room, hard falloff, corners going to actual black.
function vignette(strength, cxp = W / 2, cyp = H / 2, radius = 130) {
  if (strength <= 0) return;
  const g = cx.createRadialGradient(cxp, cyp, 8, cxp, cyp, radius);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(0.55, `rgba(0,0,0,${strength * 0.35})`);
  g.addColorStop(1, `rgba(0,0,0,${Math.min(1, strength)})`);
  cx.fillStyle = g; cx.fillRect(0, 0, W, H);
}

function tintScreen(color, alpha) {
  if (alpha <= 0) return;
  cx.globalAlpha = alpha; rect(0, 0, W, H, color); cx.globalAlpha = 1;
}

// Fine grain over everything — the VHS-soft layer the sprites sit against.
function grain(amount = 0.05) {
  if (typeof Options !== 'undefined' && Options.values && !Options.values.grain) return;
  if (amount <= 0) return;
  const step = 2, seed = (Time.frame / 3) | 0;
  cx.globalAlpha = amount;
  cx.fillStyle = '#ffffff';
  for (let y = 0; y < H; y += step) {
    for (let x = 0; x < W; x += step) {
      if (hash2(x + seed * 31, y - seed * 17) > 0.86) cx.fillRect(x, y, 1, 1);
    }
  }
  cx.globalAlpha = 1;
}


// ===== 30_world.js ===============================================
// ---------------------------------------------------------------- world
// Tiles, rooms, wandering enemies. Encounters are visible on the overworld
// and avoidable, because in the liminal zones the quiet is the point.

const TS = 16;                       // tile size
const SOLID = new Set(['#', 'T', ' ', '=']);
const WALKWAY = new Set(['P', 'D']);

// --- tile painting -----------------------------------------------------
function paintGrass(x, y, tx, ty, dim) {
  rect(x, y, TS, TS, shade('#3f7a30', dim));
  for (let i = 0; i < 14; i++) {
    const h = hash2(tx * 71 + i, ty * 37 + i * 13);
    const px = x + ((h * TS) | 0), py = y + ((hash2(i, tx * ty + i) * TS) | 0);
    rect(px, py, 1, h > 0.5 ? 2 : 1, shade(h > 0.62 ? '#4f9440' : '#33632a', dim));
  }
}
function paintBrick(x, y, tx, ty, dim) {
  rect(x, y, TS, TS, shade('#3a2622', dim));
  const bh = 4;
  for (let r = 0; r < TS / bh; r++) {
    const off = ((ty * (TS / bh) + r) % 2) ? 8 : 0;
    for (let c = -1; c < 3; c++) {
      const bx = x + off + c * 8, by = y + r * bh;
      const v = hash2(tx * 13 + c + off, ty * 29 + r);
      rect(Math.max(x, bx), by, Math.min(7, x + TS - bx), bh - 1,
           shade(v > 0.72 ? '#8a4739' : v > 0.35 ? '#7d3f34' : '#6d362c', dim));
    }
  }
}
function paintWood(x, y, tx, ty, dim) {
  rect(x, y, TS, TS, shade('#4a3324', dim));
  for (let c = 0; c < TS; c += 4) {
    rect(x + c, y, 3, TS, shade(hash2(tx * 7 + c, ty) > 0.5 ? '#553a29' : '#4a3324', dim));
    rect(x + c + 3, y, 1, TS, shade('#33231a', dim));
  }
}
function paintWater(x, y, tx, ty, dim) {
  rect(x, y, TS, TS, shade('#2b4a5c', dim));
  const t = Time.t * 0.7;
  for (let i = 0; i < 5; i++) {
    const h = hash2(tx * 17 + i, ty * 23 + i);
    const py = y + ((h * TS) | 0);
    const px = x + (((h * 2 + Math.sin(t + h * 6) * 0.12 + 1) % 1 * TS) | 0);
    rect(px, py, 3, 1, shade('#5d8fa4', dim));
  }
}
function paintCeiling(x, y, tx, ty, dim) {
  rect(x, y, TS, TS, shade('#5a5a52', dim));
  rect(x, y, TS, 1, shade('#3e3e38', dim));
  rect(x, y, 1, TS, shade('#3e3e38', dim));
  for (let i = 0; i < 6; i++) {
    const h = hash2(tx * 31 + i, ty * 11 + i);
    rect(x + ((h * TS) | 0), y + ((hash2(i, tx + ty) * TS) | 0), 1, 1, shade('#6a6a60', dim));
  }
}
function paintCarpet(x, y, tx, ty, dim) {
  rect(x, y, TS, TS, shade('#2a2530', dim));
  for (let i = 0; i < 8; i++) {
    const h = hash2(tx * 41 + i, ty * 19 + i);
    rect(x + ((h * TS) | 0), y + ((hash2(i * 3, tx - ty) * TS) | 0), 1, 1, shade('#332d3a', dim));
  }
}
function paintPath(x, y, tx, ty, dim, overWater) {
  if (overWater) {
    // stepping stones, so a way through the orchard reads as a way through
    paintWater(x, y, tx, ty, dim);
    for (let i = 0; i < 3; i++) {
      const h = hash2(tx * 61 + i, ty * 47 + i);
      const sx = x + 2 + ((h * 9) | 0), sy = y + 2 + ((hash2(i, tx + ty * 3) * 9) | 0);
      rect(sx, sy, 5, 4, shade('#6e6a5e', dim));
      rect(sx, sy, 5, 1, shade('#8a8578', dim));
    }
    return;
  }
  rect(x, y, TS, TS, shade('#6a5a42', dim));
  for (let i = 0; i < 12; i++) {
    const h = hash2(tx * 83 + i, ty * 59 + i);
    rect(x + ((h * TS) | 0), y + ((hash2(i * 7, tx - ty * 2) * TS) | 0), 1, 1,
         shade(h > 0.5 ? '#7d6c4f' : '#57492f', dim));
  }
}
function paintSnow(x, y, tx, ty, dim) {
  rect(x, y, TS, TS, shade('#b9c2cc', dim));
  for (let i = 0; i < 10; i++) {
    const h = hash2(tx * 91 + i, ty * 67 + i);
    rect(x + ((h * TS) | 0), y + ((hash2(i * 9, tx + ty * 5) * TS) | 0), 1, 1,
         shade(h > 0.6 ? '#d8e0e8' : '#9aa4b0', dim));
  }
}
function paintConcrete(x, y, tx, ty, dim) {
  rect(x, y, TS, TS, shade('#54565c', dim));
  rect(x, y, TS, 1, shade('#43454a', dim));
  rect(x, y, 1, TS, shade('#43454a', dim));
  for (let i = 0; i < 8; i++) {
    const h = hash2(tx * 37 + i, ty * 73 + i);
    rect(x + ((h * TS) | 0), y + ((hash2(i * 11, tx - ty) * TS) | 0), 1, 1,
         shade(h > 0.5 ? '#61636a' : '#484a4f', dim));
  }
}
function paintPavement(x, y, tx, ty, dim) {
  rect(x, y, TS, TS, shade('#6e6a64', dim));
  const bh = 8;
  for (let r = 0; r < TS / bh; r++) {
    const off = ((ty * 2 + r) % 2) ? 8 : 0;
    for (let c = -1; c < 3; c++) {
      const bx = x + off + c * 16, v = hash2(tx * 17 + c, ty * 41 + r);
      rect(Math.max(x, bx), y + r * bh, Math.min(15, x + TS - bx), bh - 1,
           shade(v > 0.6 ? '#7b776f' : '#66625c', dim));
    }
  }
}
// Ondo's masonry: pale block, deep mortar. Must not read like its pavement.
function paintStone(x, y, tx, ty, dim) {
  rect(x, y, TS, TS, shade('#2f2c28', dim));
  const bh = 5;
  for (let r = 0; r < 4; r++) {
    const off = ((ty * 3 + r) % 2) ? 6 : 0;
    for (let c = -1; c < 3; c++) {
      const bx = x + off + c * 12, by = y + r * bh;
      if (by >= y + TS) continue;
      const v = hash2(tx * 23 + c + off, ty * 59 + r);
      rect(Math.max(x, bx), by, Math.min(11, x + TS - bx), bh - 1,
           shade(v > 0.7 ? '#9c948a' : v > 0.35 ? '#8b8379' : '#7a736a', dim));
    }
  }
}

// Interior floorboards. Warmer and lighter than the wall behind them: with the
// same wood on both, a room read as one continuous brown field with furniture
// floating in it.
function paintPlank(x, y, tx, ty, dim) {
  rect(x, y, TS, TS, shade('#7a5a3c', dim));
  for (let r = 0; r < 4; r++) {
    const v = hash2(tx * 13, ty * 4 + r);
    rect(x, y + r * 4, TS, 3, shade(v > 0.66 ? '#87643f' : v > 0.33 ? '#7a5a3c' : '#6d5036', dim));
    rect(x, y + r * 4 + 3, TS, 1, shade('#4f3826', dim));
  }
  // The odd board end, so the run does not look printed.
  if (hash2(tx * 3, ty * 7) > 0.72) rect(x + 6, y, 1, TS, shade('#4f3826', dim));
}

// Plaster over lath, with a skirting board along the bottom of the room so the
// wall meets the floor somewhere instead of just changing colour.
function paintPlaster(x, y, tx, ty, dim) {
  rect(x, y, TS, TS, shade('#8d8272', dim));
  for (let i = 0; i < 10; i++) {
    const h = hash2(tx * 61 + i, ty * 29 + i);
    rect(x + ((h * TS) | 0), y + ((hash2(i * 5, tx - ty) * TS) | 0), 1, 1,
         shade(h > 0.5 ? '#9a8f7e' : '#7e7466', dim));
  }
  rect(x, y, TS, 1, shade('#6d6455', dim));
}

// --- interior dressing -------------------------------------------------
// Flat props with no collision and no interaction. Interiors were nine-by-seven
// boxes with one row of crates in them; this is what makes a shop look like a
// shop rather than like the inn with a different NPC standing in it.
function drawDecor(t, px, py, dim, o) {
  switch (t) {
    case 'rug':
      rect(px - 15, py - 9, 31, 19, shade('#5a2f3a', dim));
      rect(px - 13, py - 7, 27, 15, shade('#6d3a46', dim));
      rect(px - 9, py - 4, 19, 9, shade('#8a4a52', dim));
      rect(px - 5, py - 2, 11, 5, shade('#5a2f3a', dim));
      break;
    case 'counter':                       // long, waist-high, with a worn top
      rect(px - 16, py - 10, 33, 16, shade('#4a3524', dim));
      rect(px - 16, py - 12, 33, 3, shade('#7a5a3a', dim));
      rect(px - 16, py - 13, 33, 1, shade('#9a7a52', dim));
      for (let i = 0; i < 5; i++) rect(px - 13 + i * 7, py - 8, 5, 11, shade('#3d2b1d', dim));
      break;
    case 'shelf':
      rect(px - 12, py - 22, 25, 24, shade('#3f2d1e', dim));
      rect(px - 11, py - 21, 23, 22, shade('#563d29', dim));
      for (let r = 0; r < 3; r++) {
        rect(px - 11, py - 15 + r * 7, 23, 2, shade('#3f2d1e', dim));
        for (let i = 0; i < 4; i++) {
          const h = hash2(o.x * 7 + i, o.y * 5 + r);
          if (h < 0.3) continue;
          rect(px - 10 + i * 6, py - 20 + r * 7, 4, 5,
               shade(['#8a6a3a', '#5a7a6a', '#7a4a4a', '#6a6a7a'][(h * 4) | 0], dim));
        }
      }
      break;
    case 'cabinet':                       // records, ledgers, municipal misery
      rect(px - 9, py - 24, 19, 26, shade('#3a3e44', dim));
      rect(px - 8, py - 23, 17, 24, shade('#4e545c', dim));
      for (let r = 0; r < 4; r++) {
        rect(px - 7, py - 22 + r * 6, 15, 5, shade('#41464e', dim));
        rect(px - 2, py - 20 + r * 6, 5, 1, shade('#8d939c', dim));
      }
      break;
    case 'stove':
      rect(px - 10, py - 18, 21, 20, shade('#2e3238', dim));
      rect(px - 9, py - 17, 19, 18, shade('#43484f', dim));

      // Painted on the corridor wall. It is not trying to match anything.
      const seed = o.x * 31 + o.y * 17;
      rect(px - 22, py - 14, 45, 28, shade('#2a1f38', dim));
      for (let i = 0; i < 7; i++) {
        const h = hash2(seed + i, seed - i);
        const bx = px - 20 + i * 6, by = py - 11 + ((hash2(seed, i) * 16) | 0);
        const c = ['#c04a7a', '#4ac0b0', '#e0a83a', '#6a4ac0', '#3f8ad0'][(h * 5) | 0];
        if (h > 0.55) rect(bx, by, 5, 12, shade(c, dim));
        else { rect(bx - 1, by, 8, 5, shade(c, dim)); rect(bx + 1, by + 5, 4, 6, shade(c, dim)); }
      }
      rect(px - 22, py - 14, 45, 1, shade('#6a4ac0', dim));
      rect(px - 22, py + 13, 45, 1, shade('#6a4ac0', dim));
      break;
    }
    case 'neon_sign': {
      // Hung off the front of a shop. The glow is the point; the word is not.
      const pulse = 0.72 + 0.28 * Math.sin(Time.t * 2.4 + o.x);
      const hue = ['#ff4a9a', '#4ad8e0', '#ffc84a', '#8a6aff'][(o.x + o.y) % 4];
      cx.globalAlpha = 0.16 * pulse;
      circle(px, py - 8, 22, hue);
      cx.globalAlpha = 0.28 * pulse;
      circle(px, py - 8, 13, hue);
      cx.globalAlpha = 1;
      rect(px - 13, py - 16, 27, 16, '#12141c');
      rect(px - 12, py - 15, 25, 14, '#1b1f2a');
      cx.globalAlpha = pulse;
      rect(px - 9, py - 12, 3, 9, hue);
      rect(px - 9, py - 12, 8, 2, hue);
      rect(px - 9, py - 8, 6, 2, hue);
      rect(px + 3, py - 12, 3, 9, hue);
      rect(px + 3, py - 5, 6, 2, hue);
      cx.globalAlpha = 1;
      rect(px - 1, py, 3, 4, '#3a3f4a');
      break;
    }
    case 'bunting':                       // strung across a market row
      for (let i = 0; i < 6; i++) {
        const bx = px - 15 + i * 6, by = py - 14 + Math.abs(i - 2.5) | 0;
        rect(bx, by, 5, 1, shade('#6a6250', dim));
        rect(bx + 1, by + 1, 3, 4, shade(['#8a4a52', '#5a7a6a', '#8a7a4a'][i % 3], dim));
      }
      break;
  }
}

// --- roofs and facades -------------------------------------------------
// Seen from above, a building is mostly roof: only its bottom row is the face
// you walk up to. Painting the whole block in wall texture is what made every
// structure in the game read as a slab with a hole in it.
function paintShingle(x, y, tx, ty, dim) {
  rect(x, y, TS, TS, shade('#5e2f28', dim));
  for (let r = 0; r < 4; r++) {
    const off = ((ty * 4 + r) % 2) ? 4 : 0;
    for (let c = -1; c < 3; c++) {
      const bx = x + off + c * 8, by = y + r * 4;
      const v = hash2(tx * 19 + c + off, ty * 7 + r);
      rect(Math.max(x, bx), by, Math.min(7, x + TS - bx), 3,
           shade(v > 0.7 ? '#8c463a' : v > 0.35 ? '#7d3f34' : '#6b352c', dim));
      rect(Math.max(x, bx), by, Math.min(7, x + TS - bx), 1,
           shade(v > 0.5 ? '#a1554529'.slice(0, 7) : '#96503f', dim));
    }
  }
}
function paintSlate(x, y, tx, ty, dim) {
  rect(x, y, TS, TS, shade('#3d444e', dim));
  for (let r = 0; r < 4; r++) {
    const off = ((ty * 4 + r) % 2) ? 5 : 0;
    for (let c = -1; c < 3; c++) {
      const bx = x + off + c * 10, by = y + r * 4;
      const v = hash2(tx * 29 + c + off, ty * 13 + r);
      rect(Math.max(x, bx), by, Math.min(9, x + TS - bx), 3,
           shade(v > 0.66 ? '#5d6673' : v > 0.33 ? '#525a66' : '#474e59', dim));
    }
  }
}
// Corrugated steel, streaked with rust. The works has not been maintained.
function paintPanel(x, y, tx, ty, dim) {
  rect(x, y, TS, TS, shade('#4a4d54', dim));
  for (let c = 0; c < TS; c += 4) {
    rect(x + c, y, 3, TS, shade(hash2(tx * 11 + c, ty) > 0.5 ? '#565a62' : '#4a4d54', dim));
    rect(x + c + 3, y, 1, TS, shade('#33363c', dim));
  }
  for (let i = 0; i < 3; i++) {
    const h = hash2(tx * 47 + i, ty * 31 + i);
    if (h > 0.72) rect(x + ((h * TS) | 0), y + ((hash2(i, tx + ty) * TS) | 0), 2, 3,
                       shade('#6d4a33', dim));
  }
}
const ROOFS = { brick: paintShingle, stone: paintSlate, concrete: paintPanel };

// The floor slab and the roofline coping, per wall material - the same stone or
// concrete the building is made of, seen edge-on.
const STOREY_BAND = { concrete: '#727680', stone: '#9a9285', brick: '#8e6b5c' };
const CORNICE = { concrete: '#8d919a', stone: '#a89f90', brick: '#b3aa9c' };

// --- storeys ---------------------------------------------------------------
// A building here is a block of wall tiles: the bottom row is the shopfront you
// walk up to and everything above it is roof, which means every structure in the
// game was one storey tall by construction. That is right for Okobo and wrong
// for a capital.
//
// Rooms marked `tall: true` read their blocks differently: bottom row is still
// the shopfront, the topmost row becomes the roofline, and every row between is
// a floor of windows. Height then comes from the map - a four-row block is two
// storeys, a seven-row block is five - so the city can be laid out rather than
// drawn.
function paintStorey(x, y, tx, ty, dim, floor) {
  // Two windows per tile, not one. At sixteen pixels a single window per tile
  // reads as a house; a city has to read as many small rooms stacked.
  for (let i = 0; i < 2; i++) {
    if (hash2(tx * 7 + i * 3, ty * 11 + 5) < 0.10) continue;   // a bay bricked up
    const wx = x + 2 + i * 7;
    const lit = hash2(tx * 13 + i * 5, ty * 3 + 1) > 0.54;
    rect(wx, y + 3, 5, 9, shade('#191b21', dim));
    rect(wx + 1, y + 4, 3, 7, lit ? '#d6c184' : shade('#39424c', dim));
    rect(wx + 1, y + 4, 3, 2, lit ? '#f2e3ae' : shade('#4b5661', dim));
    // A lit window occasionally has someone in it, which is one pixel and does
    // more for the feeling of a populated city than any amount of wall texture.
    if (lit && hash2(tx * 3 + i, ty * 17) > 0.78) rect(wx + 2, y + 7, 1, 3, '#3a2f28');
  }
  // The floor slab between storeys, which is what stops a stack of windows
  // reading as one very tall window.
  rect(x, y + TS - 2, TS, 1, shade('#23252b', dim));
  rect(x, y + TS - 1, TS, 1, shade(floor, dim - 8));
}

// The roofline: a coping band along the bottom of the top row, so the building
// visibly stops rather than fading into the sky.
function paintCornice(x, y, tx, ty, dim, coping) {
  rect(x, y + TS - 5, TS, 1, shade('#1c1e24', dim));
  rect(x, y + TS - 4, TS, 3, shade(coping, dim + 10));
  rect(x, y + TS - 1, TS, 1, shade('#212329', dim - 6));
  // Roof furniture, sparsely: a vent housing or an aerial. Cities are cluttered
  // on top and nobody ever draws it.
  const h = hash2(tx * 23, ty * 41);
  if (h > 0.80) {
    rect(x + 4, y + 2, 7, 6, shade('#4a4e56', dim));
    rect(x + 4, y + 2, 7, 2, shade('#5e636c', dim + 6));
  } else if (h > 0.68) {
    rect(x + 8, y + 1, 1, 8, shade('#6a6f78', dim));
    rect(x + 5, y + 3, 7, 1, shade('#6a6f78', dim));
  }
}

function paintVoid(x, y) { rect(x, y, TS, TS, '#000000'); }
function paintDirt(x, y, tx, ty, dim) {
  rect(x, y, TS, TS, shade('#5a4a36', dim));
  for (let i = 0; i < 10; i++) {
    const h = hash2(tx * 53 + i, ty * 43 + i);
    rect(x + ((h * TS) | 0), y + ((hash2(i * 5, tx * 3 + ty) * TS) | 0), 1, 1,
         shade(h > 0.5 ? '#6a5842' : '#4c3d2c', dim));
  }
}

// --- room runtime ------------------------------------------------------
const World = {
  id: null, room: null, w: 0, h: 0,
  entities: [], camX: 0, camY: 0,

  load(id, at) {
    const r = ROOMS[id];
    if (!r) { console.warn('no room', id); return; }
    this.id = id; this.room = r;
    this.w = r.map[0].length; this.h = r.map.length;
    this.entities = [];

    for (const n of r.npcs || []) {
      // Some people are only there once. The game does not remark on it.
      if (n.once && Player.flags[n.once]) continue;
      this.entities.push({
        kind: 'npc', x: n.x * TS + TS / 2, y: n.y * TS + TS / 2,
        art: n.art, key: n.key, shop: n.shop, face: 'down', bob: Math.random() * 6,
      });
    }
    // Wandering enemies, only those not already beaten out of this room.
    for (const s of r.spawn || []) {
      for (let i = 0; i < s.n; i++) {
        const spot = this.findFloor();
        if (!spot) continue;
        this.entities.push({
          kind: 'enemy', species: s.name, x: spot[0], y: spot[1],
          vx: 0, vy: 0, think: Math.random() * 1.5, face: 'down',
          hp: 1, cool: 0.9,
        });
      }
    }
    if (r.objects) for (const o of r.objects) {
      if (o.t === 'collectible' && Player.flags['got_' + o.which]) continue;
      this.entities.push({ kind: 'object', ...o, x: o.x * TS + TS / 2, y: o.y * TS + TS / 2 });
    }

    // Remember the leg of the walk this room belongs to, for the map.
    const leg = routeIndexOf(id);
    if (leg >= 0 && !Player.seen.includes(leg)) Player.seen.push(leg);

    const start = at || r.start;
    Player.x = start[0] * TS + TS / 2;
    Player.y = start[1] * TS + TS / 2;
    this.exitArmed = false;
    Audio_.play(r.music || 'none');
    this.centerCamera();
  },

  findFloor() {
    for (let tries = 0; tries < 80; tries++) {
      const tx = 1 + ((Math.random() * (this.w - 2)) | 0);
      const ty = 1 + ((Math.random() * (this.h - 2)) | 0);
      if (this.solidTile(tx, ty)) continue;
      const px = tx * TS + TS / 2, py = ty * TS + TS / 2;
      if (Math.hypot(px - Player.x, py - Player.y) < 56) continue;
      return [px, py];
    }
    return null;
  },

  tile(tx, ty) {
    if (ty < 0 || ty >= this.h) return '#';
    const row = this.room.map[ty];
    if (tx < 0 || tx >= row.length) return '#';
    return row[tx];
  },
  solidTile(tx, ty) { return SOLID.has(this.tile(tx, ty)); },
  solidAt(px, py) { return this.solidTile(Math.floor(px / TS), Math.floor(py / TS)); },

  // Axis-separated box collision so walls slide rather than stick.
  move(e, dx, dy, hw = 4, hh = 3) {
    if (dx) {
      const nx = e.x + dx;
      if (!this.solidAt(nx + Math.sign(dx) * hw, e.y) &&
          !this.solidAt(nx + Math.sign(dx) * hw, e.y - hh)) e.x = nx;
    }
    if (dy) {
      const ny = e.y + dy;
      if (!this.solidAt(e.x - hw + 1, ny + Math.sign(dy) * hh) &&
          !this.solidAt(e.x + hw - 1, ny + Math.sign(dy) * hh)) e.y = ny;
    }
    e.x = Math.max(2, Math.min(this.w * TS - 2, e.x));
    e.y = Math.max(2, Math.min(this.h * TS - 2, e.y));
  },

  // Roofline, eaves and skirting, worked out from the shape of the block rather
  // than authored per building. Every structure in the game was a flat
  // rectangle of texture with a hole in it; this is what makes one read as a
  // building seen from above instead of as a wall the tiles happen to share.
  isWall(x, y) { const t = this.tile(x, y); return t === '#' || t === 'D'; },

  // Which part of a structure a wall tile is. The map's own outermost ring is
  // scenery, not a building, so it stays flat: without that test the border
  // columns have wall above and below and classify as roof.
  wallPart(tx, ty) {
    const r = this.room;
    if (INTERIOR_WALLS.has(r.wall)) return 'inside';
    if (tx === 0 || ty === 0 || tx === this.w - 1 || ty === this.h - 1) return 'border';
    const below = this.isWall(tx, ty + 1), above = this.isWall(tx, ty - 1);
    // In a tall room the rows between the shopfront and the roofline are floors.
    if (r.tall && below && above) return 'storey';
    if (r.tall && below) return 'cap';
    if (below) return 'roof';
    if (above) return 'face';
    return 'border';
  },

  // How many wall rows sit under this one, so a storey knows which floor it is.
  // Used only to lift the light a little per floor: the top of a building
  // catches more sky than the street does, and that gradient is most of what
  // sells height in a flat projection.
  floorsUnder(tx, ty) {
    let n = 0;
    for (let y = ty + 1; y < this.h && this.isWall(tx, y); y++) n++;
    return n;
  },

  // The front of a building: a window on alternate bays, and never beside the
  // door, so the doorway stays the thing your eye lands on.
  facade(tx, ty, px, py, dim) {
    if (this.isWall(tx - 1, ty) && this.tile(tx - 1, ty) === 'D') return;
    if (this.isWall(tx + 1, ty) && this.tile(tx + 1, ty) === 'D') return;
    if (hash2(tx * 5, ty * 3) < 0.18) return;
    const lit = hash2(tx * 3 + 1, ty * 9 + 2) > 0.55;
    rect(px + 3, py + 3, 10, 9, shade('#22242c', dim));
    rect(px + 4, py + 4, 8, 7, lit ? '#c8b878' : shade('#4a5560', dim));
    rect(px + 4, py + 4, 8, 3, lit ? '#e0d09a' : shade('#5c6874', dim));
    rect(px + 7, py + 4, 1, 7, shade('#22242c', dim));   // the glazing bar
    rect(px + 2, py + 12, 12, 1, shade('#8a8378', dim)); // sill
  },

  trim(tx, ty, px, py, dim, part) {
    const wall = (x, y) => this.isWall(x, y);
    const up = wall(tx, ty - 1), down = wall(tx, ty + 1);
    const left = wall(tx - 1, ty), right = wall(tx + 1, ty);
    const r = this.room;
    if (part === 'inside') return;

    const ridge = r.wall === 'concrete' ? '#7b7f88'
                : r.wall === 'stone' ? '#b3aa9c' : '#a2564a';
    const shade_ = r.wall === 'concrete' ? '#31333a'
                 : r.wall === 'stone' ? '#413c36' : '#41221d';

    // The top edge catches the light: a ridge cap along it, and a return down
    // the first pixel of each side so corners do not look bitten off.
    if (!up) {
      rect(px, py, TS, 2, shade(ridge, dim + 6));
      rect(px, py + 2, TS, 1, shade(shade_, dim));
    }
    // The bottom edge is the front of the building, in shadow, with a sill.
    if (!down) {
      rect(px, py + TS - 3, TS, 1, shade(shade_, dim));
      rect(px, py + TS - 2, TS, 2, shade(ridge, dim - 14));
    }
    if (!left) rect(px, py, 1, TS, shade(shade_, dim));
    if (!right) rect(px + TS - 1, py, 1, TS, shade(shade_, dim));
    // Corner pieces, so the ridge turns properly instead of stopping dead.
    if (!up && !left) rect(px, py, 2, 3, shade(ridge, dim + 10));
    if (!up && !right) rect(px + TS - 2, py, 2, 3, shade(ridge, dim + 10));
  },

  centerCamera() {
    this.camX = Math.round(Math.max(0, Math.min(this.w * TS - W, Player.x - W / 2)));
    this.camY = Math.round(Math.max(0, Math.min(this.h * TS - H, Player.y - H / 2)));
    if (this.w * TS < W) this.camX = Math.round((this.w * TS - W) / 2);
    if (this.h * TS < H) this.camY = Math.round((this.h * TS - H) / 2);
  },

  exitAt(px, py) {
    for (const x of this.room.exits || []) {
      if (x.requires && !Player.flags[x.requires]) continue;
      const w = x.w || 1, h = x.h || 1;
      if (px >= x.x * TS && px < (x.x + w) * TS &&
          py >= x.y * TS && py < (x.y + h) * TS) return x;
    }
    return null;
  },

  // An exit cannot fire until the player has stood clear of every exit since
  // arriving. Without this, landing on or beside a return path bounces you
  // straight back, and every doorway in the game is one tile from being that
  // bug.
  updateExitArming() {
    if (this.exitArmed) return;
    if (!this.exitAt(Player.x, Player.y)) this.exitArmed = true;
  },

  update(dt) {
    for (const e of this.entities) {
      if (e.kind === 'npc') { e.bob += dt; continue; }
      if (e.kind !== 'enemy') continue;
      e.cool -= dt;
      e.think -= dt;
      if (e.think <= 0) {
        e.think = 0.7 + Math.random() * 1.6;
        const dir = (Math.random() * 5) | 0;
        const sp = 15;
        e.vx = [0, sp, -sp, 0, 0][dir]; e.vy = [0, 0, 0, sp, -sp][dir];
        if (e.vx) e.face = e.vx > 0 ? 'right' : 'left';
        else if (e.vy) e.face = e.vy > 0 ? 'down' : 'up';
      }
      this.move(e, e.vx * dt, e.vy * dt, 5, 4);
    }
    this.updateExitArming();
    this.centerCamera();
  },

  touchedEnemy() {
    for (const e of this.entities) {
      if (e.kind !== 'enemy' || e.cool > 0) continue;
      if (Math.abs(e.x - Player.x) < 10 && Math.abs(e.y - Player.y) < 11) return e;
    }
    return null;
  },

  // Whatever the player is facing, within reach.
  facing() {
    const d = { up: [0, -12], down: [0, 12], left: [-12, 0], right: [12, 0] }[Player.face];
    const fx = Player.x + d[0], fy = Player.y + d[1];
    let best = null, bestD = 15;
    for (const e of this.entities) {
      if (e.kind === 'enemy') continue;
      const dist = Math.hypot(e.x - fx, e.y - fy);
      if (dist < bestD) { bestD = dist; best = e; }
    }
    return best;
  },

  draw() {
    const r = this.room;
    const dim = r.bright ? 8 : (r.dark ? -46 : -22);
    const x0 = Math.floor(this.camX / TS), x1 = Math.ceil((this.camX + W) / TS);
    const y0 = Math.floor(this.camY / TS), y1 = Math.ceil((this.camY + H) / TS);
    const floorFn = FLOORS[r.floor] || paintGrass;
    const wallFn = WALLS[r.wall] || paintBrick;

    for (let ty = y0; ty <= y1; ty++) {
      for (let tx = x0; tx <= x1; tx++) {
        const px = tx * TS - this.camX, py = ty * TS - this.camY;
        const t = this.tile(tx, ty);
        if (t === ' ') { paintVoid(px, py); continue; }
        if (t === '#') {
          // Interior rooms are all wall; outdoor blocks are roof except along
          // the front, and the map's own border is neither.
          const part = this.wallPart(tx, ty);
          // Each floor up is lit a little more: the street is in shadow and the
          // top of the building is not. Capped so a tower does not go white.
          const lift = part === 'storey' || part === 'cap'
            ? Math.min(16, this.floorsUnder(tx, ty) * 3) : 0;
          if (part === 'roof') (ROOFS[r.wall] || paintShingle)(px, py, tx, ty, dim);
          else wallFn(px, py, tx, ty, dim + lift);
          if (part === 'face') this.facade(tx, ty, px, py, dim);
          if (part === 'storey') {
            paintStorey(px, py, tx, ty, dim + lift, STOREY_BAND[r.wall] || '#8e6b5c');
          }
          if (part === 'cap') {
            paintCornice(px, py, tx, ty, dim + lift, CORNICE[r.wall] || '#b3aa9c');
          }
          this.trim(tx, ty, px, py, dim, part);
          continue;
        }
        if (t === 'P') { paintPath(px, py, tx, ty, dim, r.floor === 'water'); continue; }
        if (t === 'D') {
          // a doorway punched through the wall it sits in
          wallFn(px, py, tx, ty, dim - 14);
          rect(px + 3, py + 2, TS - 6, TS - 2, shade('#3b3b42', dim));
          rect(px + 4, py + 3, TS - 8, TS - 3, shade('#8a8a92', dim));
          rect(px + TS - 6, py + 9, 1, 2, '#2a2a30');
          continue;
        }
        if (t === '~') { paintWater(px, py, tx, ty, dim); continue; }
        floorFn(px, py, tx, ty, dim);
        if (t === 'T') {
          const nm = r.floor === 'water' ? 'bigtree' : 'tree';
          const pal = r.floor === 'snow' ? 'winter' : (r.floor === 'water' ? 'tree' : 'bigtree');
          sprite(nm, px + (TS - spriteWidth(nm)) / 2, py - spriteHeight(nm) + TS + 2, pal);
        }
        if (t === '=') {
          const metal = r.floor === 'concrete';
          rect(px + 1, py + 2, TS - 2, TS - 5, shade(metal ? '#54585f' : '#4a3a2a', dim));
          rect(px + 1, py + 2, TS - 2, 2, shade(metal ? '#6d7178' : '#5d4a35', dim));
          rect(px + 2, py + TS - 5, TS - 4, 1, shade(metal ? '#31343a' : '#2e241a', dim));
        }
      }
    }

    if (r.decor) {
      for (const d of r.decor) {
        const dx = d.x * TS + TS / 2 - this.camX, dy = d.y * TS + TS / 2 - this.camY;
        if (dx < -40 || dx > W + 40 || dy < -48 || dy > H + 48) continue;
        drawDecor(d.t, dx, dy, dim, d);
      }
    }

    // Everything that stands up, sorted by depth.
    const drawables = [...this.entities, { kind: 'player', x: Player.x, y: Player.y }];
    drawables.sort((a, b) => a.y - b.y);
    for (const e of drawables) this.drawEntity(e);
  },

  drawEntity(e) {
    const px = Math.round(e.x - this.camX), py = Math.round(e.y - this.camY);
    if (e.kind === 'player') { Player.draw(px, py); return; }

    if (e.kind === 'npc') {
      // Sprite and palette share a name: every person is one entry in
      // gen_sprites' PEOPLE table, so they cannot be mismatched here.
      const nm = e.art;
      const w = spriteWidth(nm), h = spriteHeight(nm);
      const bob = Math.sin(e.bob * 1.6) > 0.94 ? 1 : 0;
      rect(px - 4, py + 1, 9, 2, 'rgba(0,0,0,0.28)');
      sprite(nm, px - w / 2, py - h + 3 - bob, nm);
      return;
    }

    if (e.kind === 'enemy') {
      const art = ENEMY_ART[e.species] || { spr: 'dog', pal: 'dog' };
      const w = spriteWidth(art.spr), h = spriteHeight(art.spr);
      rect(px - 4, py + 1, 9, 2, 'rgba(0,0,0,0.28)');
      const bob = Math.sin(Time.t * 3 + e.x) > 0.6 ? 1 : 0;
      sprite(art.spr, px - w / 2, py - h + 3 - bob, art.pal, e.face === 'left');
      return;
    }

    if (e.kind === 'object') this.drawObject(e, px, py);
  },

  drawObject(o, px, py) {
    switch (o.t) {
      case 'bed':
        rect(px - 7, py - 12, 15, 20, '#5a4038');
        rect(px - 6, py - 10, 13, 9, '#c8c0b4');
        rect(px - 6, py + 1, 13, 6, '#8a5a52');
        break;
      case 'dresser':
        rect(px - 7, py - 10, 15, 16, '#4a3628');
        rect(px - 5, py - 7, 11, 4, '#3a2a1e'); rect(px - 5, py - 1, 11, 4, '#3a2a1e');
        break;
      case 'window': {
        rect(px - 9, py - 12, 19, 16, '#2a2a34');
        rect(px - 7, py - 10, 15, 12, '#0d1018');
        rect(px - 1, py - 10, 1, 12, '#2a2a34'); rect(px - 7, py - 5, 15, 1, '#2a2a34');
        break;
      }
      case 'poster':
        rect(px - 6, py - 12, 13, 15, '#3a3550');
        rect(px - 4, py - 10, 9, 11, '#4d4770');
        rect(px - 2, py - 7, 5, 5, '#6b62a0');
        break;
      case 'switch':
        rect(px - 2, py - 8, 5, 7, '#c8c8c0'); rect(px - 1, py - 6, 3, 3, '#8a8a84');
        break;
      case 'door': {
        rect(px - 7, py - 5, 15, 18, '#2a1e16');
        rect(px - 6, py - 4, 13, 16, '#523d2c');
        rect(px - 6, py - 4, 3, 16, '#634b36');
        rect(px - 4, py - 1, 9, 6, '#412f22');
        rect(px + 3, py + 6, 2, 2, '#c8b46a');
        if (Player.flags.hallLight !== false) {
          // The only light in the room, and it is not for him.
          rect(px - 6, py + 12, 13, 1, '#ffeec2');
          rect(px - 6, py + 13, 13, 1, 'rgba(255,232,176,0.75)');
          const g = cx.createLinearGradient(0, py + 13, 0, py + 34);
          g.addColorStop(0, 'rgba(255,226,160,0.30)');
          g.addColorStop(1, 'rgba(255,226,160,0)');
          cx.fillStyle = g;
          cx.beginPath();
          cx.moveTo(px - 7, py + 13); cx.lineTo(px + 8, py + 13);
          cx.lineTo(px + 15, py + 34); cx.lineTo(px - 14, py + 34);
          cx.closePath(); cx.fill();
        }
        break;
      }

// ===== 40_dialogue.js ============================================
// ---------------------------------------------------------------- dialogue & player
// Text boxes get a distinct treatment per speaker class. The Custodian's box
// degrades and has no advance prompt: the player does not control when he is
// finished.

const BOX_STYLE = {
  npc:       { font: '#f0ece2', border: '#e8e4da', bg: 'rgba(10,10,14,0.94)', prompt: true },
  system:    { font: '#cfe0e8', border: '#8fa8b4', bg: 'rgba(6,10,14,0.94)', prompt: true },
  vixtry:    { font: '#cfe0e8', border: '#8fa8b4', bg: 'rgba(6,10,14,0.94)', prompt: true },
  custodian: { font: '#ffffff', border: '#ffffff', bg: 'rgba(0,0,0,0.97)', prompt: false, degrade: true },
};

const Dialogue = {
  queue: [], page: null, chars: 0, done: false, hold: 0, active: false,
  onFinish: null,

  say(pages, onFinish) {
    if (typeof pages === 'string') pages = [{ text: pages, speaker: 'npc' }];
    pages = pages.map(p => (typeof p === 'string' ? { text: p, speaker: 'npc' } : p));
    this.queue = pages.slice();
    this.onFinish = onFinish || null;
    this.active = true;
    this.next();
  },

  next() {
    if (!this.queue.length) {
      this.active = false; this.page = null;
      const f = this.onFinish; this.onFinish = null;
      if (f) f();
      return;
    }
    this.page = this.queue.shift();
    this.page.lines = wrap(this.page.text, W - 24);
    this.chars = 0; this.done = false;
    this.hold = this.page.speaker === 'custodian' ? 2.6 : 0;
  },

  update(dt) {
    if (!this.active || !this.page) return;
    const total = this.page.lines.join('').length;
    const mult = [0.6, 1, 1.7][(typeof Options !== 'undefined' && Options.values.textSpeed) ?? 1] || 1;
    const speed = (this.page.speaker === 'custodian' ? 44 : 62) * mult;
    if (!this.done) {
      const before = this.chars | 0;
      this.chars = Math.min(total, this.chars + speed * dt);
      if ((this.chars | 0) > before && Time.frame % 2 === 0) Audio_.sfx('blip');
      if (this.chars >= total) this.done = true;
      if (Input.hit('ok')) { this.chars = total; this.done = true; }
      return;
    }
    if (this.page.speaker === 'custodian') {
      this.hold -= dt;
      if (this.hold <= 0) this.next();
      return;
    }
    if (Input.hit('ok')) { Audio_.sfx('ok'); this.next(); }
  },

  draw() {
    if (!this.active || !this.page) return;
    const st = BOX_STYLE[this.page.speaker] || BOX_STYLE.npc;
    const lines = this.page.lines;
    const boxH = Math.max(38, 12 + lines.length * 10);
    const y = H - boxH - 4;
    rect(6, y, W - 12, boxH, st.bg);
    rect(6, y, W - 12, 1, st.border); rect(6, y + boxH - 1, W - 12, 1, st.border);
    rect(6, y, 1, boxH, st.border); rect(W - 7, y, 1, boxH, st.border);

    let remaining = this.chars | 0;
    for (let i = 0; i < lines.length; i++) {
      const full = lines[i];
      const show = full.slice(0, Math.max(0, remaining));
      remaining -= full.length;
      // The Custodian's box loses its kerning as it goes.
      const spacing = st.degrade ? (i % 2 ? 0 : 2) : 1;
      text(show, 12, y + 7 + i * 10, st.font, spacing);
      if (remaining <= 0) break;
    }

    if (this.page.name) {
      rect(10, y - 9, textWidth(this.page.name) + 8, 10, st.bg);
      text(this.page.name, 14, y - 8, st.border);
    }
    if (this.done && st.prompt && Math.sin(Time.t * 5) > 0) {
      text('>', W - 16, y + boxH - 11, st.font);
    }
  },
};

// --- player ------------------------------------------------------------
// Seconds per walk frame. At 62 px/s and 16 px tiles this puts a footfall
// every ~10 px, which is the rate that stops the stride reading as a skid.
const STEP_FRAME = 0.16;

const Player = {
  name: 'KID', x: 0, y: 0, face: 'down', walkT: 0, moving: false,
  level: 1, exp: 0, hp: 30, pp: 10, sp: 8, money: 0,
  bag: {}, flags: {}, collectibles: 0, notes: [],
  seen: [],                               // route indices reached, for the map
  stepAcc: 0,
  equip: { weapon: 'Bare Hands', body: 'School Clothes' },
  owned: {},                              // gear held, equipped or not
  passives: {},                           // milestone level -> chosen passive id
  owed: [],                               // milestones reached but not yet picked

  // --- equipment -------------------------------------------------------
  // Two slots and no accessories, so this stays a sum over two names rather
  // than anything with a loadout in it.
  gearBonus(stat) {
    let n = 0;
    for (const slot in this.equip) {
      const piece = DATA.equipment[this.equip[slot]];
      if (piece && piece.stats[stat]) n += piece.stats[stat];
    }
    return n;
  },

  ownGear(name) {
    if (!DATA.equipment[name]) return false;
    const isNew = !this.owned[name];
    this.owned[name] = true;
    return isNew;
  },

  wear(name) {
    const piece = DATA.equipment[name];
    if (!piece || !this.owned[name]) return false;
    this.equip[piece.slot] = name;
    // Wearing something with an HP bonus must not leave you above your own
    // maximum when you take it off again.
    this.hp = Math.min(this.hp, this.maxHp);
    return true;
  },

  // --- milestones ------------------------------------------------------
  // Every tenth level: the trickle goes up on its own, and one passive is
  // chosen. The choice is the only durable decision in the whole progression.
  get regenBonus() {
    const m = DATA.milestones;
    return Math.floor(this.level / m.every) * m.regen_bonus;
  },

  // The value of a chosen passive of this kind, or 0. Kinds are unique across
  // the table, so at most one pick can answer.
  passive(kind) {
    for (const lv in this.passives) {
      const pick = (DATA.milestones.choices[lv] || []).find(p => p.id === this.passives[lv]);
      if (pick && pick.kind === kind) return pick.value;
    }
    return 0;
  },

  milestonesUpTo(level) {
    const every = DATA.milestones.every;
    const out = [];
    for (let lv = every; lv <= level; lv += every) {
      if (DATA.milestones.choices[lv]) out.push(lv);
    }
    return out;
  },

  statAt(level, stat) {
    const keys = Object.keys(DATA.statCurve).map(Number).sort((a, b) => a - b);
    let lo = keys[0], hi = keys[keys.length - 1];
    for (const k of keys) { if (k <= level) lo = k; }
    for (let i = keys.length - 1; i >= 0; i--) { if (keys[i] >= level) hi = keys[i]; }
    if (lo === hi) return DATA.statCurve[lo][stat];
    const t = (level - lo) / (hi - lo);
    return Math.round(DATA.statCurve[lo][stat] + t * (DATA.statCurve[hi][stat] - DATA.statCurve[lo][stat]));
  },
  // Gear is added on top of the curve, and a stat can never be driven below 1:
  // the Lead Apron is meant to be slow, not motionless.
  stat(key, gearKey) {
    return Math.max(1, this.statAt(this.level, key) + this.gearBonus(gearKey));
  },
  get maxHp() { return this.stat('HP', 'hp'); },
  get maxPp() { return this.statAt(this.level, 'PP'); },
  get maxSp() { return this.statAt(this.level, 'SP'); },
  get atk()   { return this.stat('ATK', 'atk'); },
  get spatk() { return this.stat('SPATK', 'spatk'); },
  get def()   { return this.stat('DEF', 'def'); },
  get spdef() { return this.stat('SPDEF', 'spdef'); },
  get spd()   { return this.stat('SPD', 'spd'); },

  moves(kind) {
    return DATA.moves[kind].filter(m => m.level <= this.level);
  },

  expToReach(n) { return Math.round(1.2 * n * n * n); },

  gainExp(amount) {
    this.exp += amount;
    const gained = [];
    while (this.level < DATA.levelCap && this.exp >= this.expToReach(this.level + 1)) {
      this.level++;
      gained.push(this.level);
    }
    if (gained.length) {
      this.hp = this.maxHp; this.pp = this.maxPp; this.sp = this.maxSp;
      // Milestones are queued rather than prompted here: this runs mid-battle,
      // and a menu that opens over a fight is a menu that eats the win screen.
      for (const lv of this.milestonesUpTo(this.level)) {
        if (!this.passives[lv] && !this.owed.includes(lv)) this.owed.push(lv);
      }
    }
    return gained;
  },

  // Moves learned across a span of levels, for the level-up message.
  movesLearnedAt(level) {
    const out = [];
    for (const k of ['physical', 'special'])
      for (const m of DATA.moves[k]) if (m.level === level) out.push(m.name);
    return out;
  },

  addItem(name, n = 1) { this.bag[name] = (this.bag[name] || 0) + n; },
  useItem(name) {
    if (!this.bag[name]) return false;
    this.bag[name]--; if (!this.bag[name]) delete this.bag[name];
    return true;
  },
  restore() { this.hp = this.maxHp; this.pp = this.maxPp; this.sp = this.maxSp; },

  update(dt) {
    if (Dialogue.active || Game.mode !== 'field') { this.moving = false; return; }
    const sp = 62;
    let dx = 0, dy = 0;
    if (Input.down('left')) dx -= 1;
    if (Input.down('right')) dx += 1;
    if (Input.down('up')) dy -= 1;
    if (Input.down('down')) dy += 1;
    if (dx && dy) { dx *= 0.707; dy *= 0.707; }
    this.moving = !!(dx || dy);
    if (dx) this.face = dx > 0 ? 'right' : 'left';
    else if (dy) this.face = dy > 0 ? 'down' : 'up';
    const interval = STEP_FRAME * 2;        // one footfall per stride frame
    if (this.moving) {
      World.move(this, dx * sp * dt, dy * sp * dt);
      // walkT counts animation frames, so the cycle and the footstep sound are
      // driven by the same number and cannot drift apart.
      this.walkT += dt / STEP_FRAME;
      this.stepAcc += dt;
      if (this.stepAcc > interval) {
        this.stepAcc = 0;
        Audio_.sfx(World.room.floor === 'water' ? 'water' : 'step');
      }
    } else { this.walkT = 0; this.stepAcc = interval; }
  },

  draw(px, py) {
    const base = this.face === 'up' ? 'player_up'
               : this.face === 'down' ? 'player_down' : 'player_side';
    // Four-beat cycle: stride, contact, other stride, contact. Going straight
    // between the two strides makes him skate; the contact pose in between is
    // what reads as a footfall — and it is the frame the step sound lands on.
    const CYCLE = ['_1', '', '_2', ''];
    const name = this.moving
      ? base + CYCLE[Math.floor(this.walkT) % 4]
      : base;
    const w = spriteWidth(name), h = spriteHeight(name);
    rect(px - 5, py + 1, 11, 2, 'rgba(0,0,0,0.32)');
    sprite(name, px - w / 2, py - h + 3, 'player', this.face === 'left');
  },
};


// ===== 50_battle.js ==============================================
// ---------------------------------------------------------------- battle
// Turn-based, one combatant, no party. The camera sits behind the player so
// only the top of his head is in frame; he is never seen taking a hit.

// "48 BASE POWER, 1 HIT" / "9 BASE POWER PER HIT, 2-4 HITS". Read off the data,
// so a retune in data/moves.json changes what the game says about itself.
// Uppercase because the font has no room below the baseline: lowercase p, g and
// y sit their descenders inside the glyph box and read as capitals.
function moveStatLine(m) {
  if (!m || m.cost === undefined) return '';
  const hits = Array.isArray(m.hits) ? `${m.hits[0]}-${m.hits[1]} HITS`
             : `${m.hits || 1} HIT${(m.hits || 1) > 1 ? 'S' : ''}`;
  if (!m.power) {
    if (m.heal_fraction) return `RESTORES ${Math.round(m.heal_fraction * 100)}% MAX HP`;
    if (m.inflicts) return `INFLICTS ${m.inflicts.toUpperCase()}`;
    return 'NO DAMAGE';
  }
  const per = Array.isArray(m.hits) || (m.hits || 1) > 1 ? ' PER HIT' : '';
  const pow = Array.isArray(m.power) ? `${m.power[0]}-${m.power[1]}` : m.power;
  return `${pow} BASE POWER${per}, ${hits}`;
}

const Battle = {
  active: false, enemy: null, state: 'intro', log: [], logT: 0,
  cursor: 0, sub: null, subCursor: 0, subScroll: 0, rep: {},
  shake: 0, flash: 0, enemyHurt: 0, playerHurt: 0, result: null,
  onEnd: null, backdrop: null, entityRef: null, turn: 0,
  homesick: false, mine: {}, stance: 0, blocked: 0,
  stages: { atk: 0, def: 0, spatk: 0, spdef: 0, spd: 0 },

  makeEnemy(species, opts = {}) {
    const def = DATA.enemies[species];
    const level = opts.level || (def ? def.level : 5);
    const role = DATA.roles[(def && def.role) || 'standard'];
    const c = DATA.enemyCurve;
    const hpMul = opts.hpMul || 1, atkMul = opts.atkMul || 1;
    const hp = Math.round(
      (c.HP.base + c.HP.per_level * level + c.HP.per_level_squared * level * level) * role.HP * hpMul);
    return {
      species, name: opts.name || species, level,
      boss: !!opts.boss,
      hp, maxHp: hp,
      atk: (c.ATK.base + c.ATK.per_level * level) * role.ATK * atkMul,
      def: (c.DEF.base + c.DEF.per_level * level) * role.DEF,
      spd: (c.SPD.base + c.SPD.per_level * level) * role.SPD,
      power: c.attack_power,
      roleHp: role.HP,
      inaction: (def && def.inaction_rate) || 0,
      inflicts: (def && def.inflicts) || opts.inflicts || null,
      dealsDamage: !(def && def.deals_damage === false),
      art: ENEMY_ART[species] || { spr: 'dog', pal: 'dog' },
      scale: opts.scale || null,
      exp: opts.exp || null,
      restoresOnce: opts.restoresOnce || 0,
      restored: false,
      phase: 1, phases: opts.phases || 1,
      tiers: opts.tiers || null, tier: 1, baseAtk: 0, baseDef: 0,
    };
  },

  start(enemy, entityRef, onEnd) {
    if (enemy.tiers) {
      enemy.baseAtk = enemy.atk; enemy.baseDef = enemy.def;
      enemy.atk = enemy.baseAtk * enemy.tiers.atk_multiplier[0];
      enemy.def = enemy.baseDef * enemy.tiers.def_multiplier[0];
    }
    this.active = true; this.enemy = enemy; this.entityRef = entityRef || null;
    this.state = 'intro'; this.log = []; this.cursor = 0; this.sub = null;
    this.subCursor = 0; this.subScroll = 0; this.turn = 0;
    this.shake = 0; this.flash = 0.5; this.enemyHurt = 0; this.playerHurt = 0;
    this.result = null; this.onEnd = onEnd || null;
    this.homesick = false; this.critFlash = 0; this.lastCrit = false;
    this.stance = 0;                      // turns of Counter Stance left
    this.blocked = 0;                     // damage it soaked, to hand back
    this.stages = { atk: 0, def: 0, spatk: 0, spdef: 0, spd: 0 };
    enemy.stages = { atk: 0, def: 0, spatk: 0, spdef: 0, spd: 0 };
    enemy.status = {};
    this.mine = {};        // the player's statuses; Homesick has its own flag
    this.enemyDone = false; this.pending = null;
    this.backdrop = { floor: World.room.floor, wall: World.room.wall, bright: World.room.bright };
    Audio_.play(enemy.boss ? 'boss' : 'battle');
    this.push(`${enemy.name.toUpperCase()} appeared.`);
    this.state = 'message';
    this.after = () => { this.state = 'menu'; };
  },

  push(msg) { this.log.push(msg); this.logT = 0; },

  // --- damage ----------------------------------------------------------
  // The player's chance to land a critical, at a given SPD. Capped, so a fast
  // late-game build does not crit every other swing.
  critChance(spd) {
    const d = DATA.damage;
    // Sharp Eye rides on top of the speed term but still under the same cap,
    // so the passive shortens the climb rather than raising the ceiling.
    return Math.min(d.critMax, d.critChance + spd * d.critPerSpd + Player.passive('crit_bonus'));
  },

  // `spd` is the attacker's speed, and passing it is what allows a critical.
  // Enemies never pass it, because enemies never crit: a critical the player
  // could not have played around lands as the game cheating, and this game
  // spends its difficulty on attrition and boss design instead. See
  // data/progression.json.
  roll(atk, power, def, spd) {
    const d = DATA.damage;
    const raw = (atk * power) / d.divisor - def * d.defCoeff;
    let dmg = raw * (0.9 + Math.random() * 0.2);
    let crit = false;
    if (spd !== undefined && Math.random() < this.critChance(spd)) {
      // A crit ignores the defence term entirely, which is what makes it worth
      // shouting about against a wall.
      dmg = (atk * power) / d.divisor * d.critMult;
      dmg *= 1 + Player.passive('crit_followup');
      crit = true;
    }
    this.lastCrit = crit;
    return Math.max(1, Math.round(dmg));
  },

  // --- stat stages and statuses ----------------------------------------
  // Stages move a stat by +/-25% each, capped at +/-3, and reset when the fight
  // ends (docs/04). Everything that referenced them - Counter Stance, Mind Fog,
  // Static Pulse, Gut Check, and every booster and debuff item - did nothing at
  // all before this existed.
  stageMul(n) { return 1 + 0.25 * Math.max(-3, Math.min(3, n || 0)); },

  bumpStage(who, stat, by) {
    const bag = who === 'enemy' ? this.enemy.stages : this.stages;
    const stats = stat === 'all' ? ['atk', 'def', 'spatk', 'spdef', 'spd'] : [stat];
    let moved = false;
    for (const k of stats) {
      const was = bag[k] || 0;
      const now = Math.max(-3, Math.min(3, was + by));
      if (now !== was) moved = true;
      bag[k] = now;
    }
    const name = who === 'enemy' ? this.enemy.name : Player.name;
    const label = stat === 'all' ? 'Everything' : stat.toUpperCase();
    if (!moved) this.push(`${label} will not go any further.`);
    else this.push(`${name}: ${label} ${by > 0 ? 'up' : 'down'}${Math.abs(by) > 1 ? ' sharply' : ''}.`);
    Audio_.sfx(by > 0 ? 'heal' : 'psy');
    return moved;
  },

  // Statuses land on either side. Homesick is the exception: it only ever goes
  // on the player, it has no duration, and the bag cannot lift it (docs/04), so
  // it keeps its own flag rather than sitting in the bag with a null timer.
  afflict(status, who) {
    const onEnemy = who !== 'player';
    const name = onEnemy ? this.enemy.name : Player.name;
    if (this.carrying(status, onEnemy ? 'enemy' : 'player')) {
      this.push(`${name} is already ${status}.`);
      return false;
    }
    const spec = (DATA.statuses || []).find(s => s.name === status);
    if (!onEnemy && status === 'Homesick') this.homesick = true;
    else {
      const bag = onEnemy ? (this.enemy.status = this.enemy.status || {}) : this.mine;
      bag[status] = (spec && spec.duration) || 3;
    }
    this.push(`${name} is ${status}.`);
    Audio_.sfx('psy');
    return true;
  },

  // Homesick gets its own line because it is the one the game is about; the
  // rest announce themselves plainly.
  inflictOnPlayer(e) {
    if (e.inflicts === 'Homesick') {
      this.homesick = true;
      this.push(`${e.name} made you think of home.`);
      Audio_.sfx('psy');
      return;
    }
    this.afflict(e.inflicts, 'player');
  },

  carrying(status, who) {
    if (who === 'enemy') return !!(this.enemy.status && this.enemy.status[status] > 0);
    if (status === 'Homesick') return this.homesick;
    return this.mine[status] > 0;
  },

  has(status) { return this.carrying(status, 'enemy'); },

  // Whatever numbers apply to whoever is carrying it, straight out of
  // data/moves.json. The two sides differ - an enemy has no PP to drain and no
  // bag to reach for - so each status carries both readings and none of those
  // figures are typed into this file.
  fx(kind, who) {
    const key = who === 'enemy' ? 'enemy_effect' : 'player_effect';
    const s = (DATA.statuses || []).find(
      x => x[key] && x[key].kind === kind && this.carrying(x.name, who));
    return s ? s[key] : null;
  },

  tickStatuses() {
    // Clear Head only shortens what is on the player; an enemy's Fog is not
    // the player's to shrug off.
    const shed = Player.passive('status_shed') || 1;
    for (const [bag, name, rate] of [[this.enemy.status, this.enemy.name, 1],
                                     [this.mine, Player.name, shed]]) {
      if (!bag) continue;
      for (const k in bag) {
        bag[k] -= rate;
        if (bag[k] <= 0) { delete bag[k]; this.push(`${name} is no longer ${k}.`); }
      }
    }
  },

  // The enemy's defence, after Numb and any stage changes.
  enemyDef() {
    const soft = this.fx('soften', 'enemy');
    return this.enemy.def * this.stageMul(this.enemy.stages.def) * (soft ? soft.multiplier : 1);
  },

  canFlee() {
    if (this.enemy.boss) return false;          // shows ??, and ?? is never below yours
    return this.enemy.level <= Player.level;
  },

  // --- turn order ------------------------------------------------------
  // Actions sort by SPD, ties broken by a coin flip, and a move's own priority
  // overrides both — see docs/04. Without this the player always acted first,
  // SPD did nothing outside the crit roll, and `Wind-Up Punch` was a worse
  // Punch that lied about it in its own description.
  playerFirst(move) {
    if (move && move.priority === 'first') return true;
    if (move && move.priority === 'last') return false;
    if (Player.spd === this.enemy.spd) return Math.random() < 0.5;
    return Player.spd > this.enemy.spd;
  },

  // Queue the player's action behind the enemy's. `why` is optional and is only
  // used where the delay is the move's own doing; losing a speed roll is not
  // announced, because the enemy's attack landing first says it already.
  yieldTo(act, why) {
    this.pending = act;
    if (why) {
      this.push(why);
      this.state = 'message';
      this.after = () => this.enemyTurn();
      return;
    }
    this.enemyTurn();
  },

  // Where every player action lands once it has resolved.
  afterPlayer() {
    if (this.enemy.hp <= 0) { this.checkEnemy(); return; }
    if (this.enemyDone) { this.startTurn(); return; }
    this.enemyTurn();
  },

  // --- player actions --------------------------------------------------
  // What the move costs right now. Drained makes specials dearer, so the number
  // the submenu prints and the number the check uses come from one place.
  moveCost(kind, move) {
    if (kind !== 'special') return move.cost;
    const discount = Player.passive('sp_discount');
    const cost = discount ? Math.max(1, Math.round(move.cost * discount)) : move.cost;
    const drain = this.fx('drain', 'player');
    // Drained is applied after the discount, so Open Line softens it rather
    // than being cancelled by it.
    return drain ? Math.ceil(cost * drain.sp_cost_multiplier) : cost;
  },

  useMove(kind, move) {
    const pool = kind === 'physical' ? 'pp' : 'sp';
    const cost = this.moveCost(kind, move);
    if (Player[pool] < cost) {
      // Not an action: the turn is not spent, and the menu goes back to the top
      // rather than leaving a dead submenu behind.
      Audio_.sfx('wrong');
      this.push('Not enough ' + pool.toUpperCase() + '.');
      this.state = 'message';
      this.after = () => { this.sub = null; this.state = 'menu'; };
      return;
    }
    Player[pool] -= cost;
    this.sub = null;
    if (!this.playerFirst(move)) {
      // "Winds up" is the move describing itself, not a turn-order caption, so
      // it stays. Losing on speed passes silently.
      this.yieldTo(() => this.resolveMove(kind, move),
                   move.priority === 'last' ? `${Player.name} winds up.` : null);
      return;
    }
    this.resolveMove(kind, move);
  },

  resolveMove(kind, move) {
    this.push(move.name.toUpperCase() + '!');

    if (move.heal_fraction) {
      const amt = Math.round(Player.maxHp * move.heal_fraction);
      Player.hp = Math.min(Player.maxHp, Player.hp + amt);
      Audio_.sfx('heal');
      this.push(`Recovered ${amt} HP.`);
      if (move.name === 'Mend+') this.homesick = false;
      this.state = 'message'; this.after = () => this.afterPlayer();
      return;
    }
    if (move.name === 'Quiet Room') {
      this.quiet = 3;
      if (this.homesick) { this.homesick = false; this.push('The room went quiet.'); }
      else this.push('The room went quiet.');
      Audio_.sfx('heal');
      this.state = 'message'; this.after = () => this.afterPlayer();
      return;
    }
    if (move.name === 'Counter Stance') {
      // Lasts through the enemy's next attack, not "this turn" literally: if it
      // expired at end of turn it would only ever work when the player was
      // already going second, which is the turn you least want to brace on.
      this.stance = 1;
      this.blocked = 0;
      this.push(`${Player.name} braces.`);
      Audio_.sfx('ok');
      this.state = 'message'; this.after = () => this.afterPlayer();
      return;
    }
    if (!move.power) {
      if (move.inflicts) {
        this.afflict(move.inflicts);
        // Static Pulse also takes a step off their speed.
        if (move.name === 'Static Pulse') this.bumpStage('enemy', 'spd', -1);
      } else this.push('Nothing obvious happened.');
      Audio_.sfx('psy');
      this.state = 'message'; this.after = () => this.afterPlayer();
      return;
    }

    // Last Word is a stage the player never spent a turn on, granted only while
    // the HP bar is in the red.
    const desperate = Player.passive('desperate');
    const cornered = desperate && Player.hp <= Player.maxHp * desperate ? 1 : 0;
    const stat = (kind === 'physical' ? Player.atk : Player.spatk)
               * this.stageMul(this.stages[kind === 'physical' ? 'atk' : 'spatk'] + cornered);
    let hits = move.hits || 1;
    if (Array.isArray(hits)) hits = hits[0] + ((Math.random() * (hits[1] - hits[0] + 1)) | 0);
    // Long Reach only ever adds to something that already swings more than once.
    const reach = Player.passive('extra_hit');
    if (hits > 1 && reach && Math.random() < reach) hits++;
    let power = move.power;
    if (Array.isArray(power)) {
      const lowHp = 1 - Player.hp / Player.maxHp;
      power = Math.round(power[0] + (power[1] - power[0]) * Math.min(1, lowHp / 0.85));
    }
    const blur = this.fx('miss', 'player');
    const acc = (move.accuracy || 1) * (blur ? 1 - blur.chance : 1);
    if (acc < 1 && Math.random() > acc) {
      this.push('It missed.');
      Audio_.sfx('wrong');
      this.state = 'message'; this.after = () => this.afterPlayer();
      return;
    }

    let total = 0, crits = 0;
    const spd = Player.spd * this.stageMul(this.stages.spd);
    // Severance ignores the defence term entirely, which is its whole point.
    const against = move.name === 'Severance' ? 0 : this.enemyDef();
    for (let i = 0; i < hits; i++) {
      total += this.roll(stat, power, against, spd);
      if (this.lastCrit) crits++;
    }
    this.enemy.hp -= total;
    // A crit is worth seeing as well as reading: harder shake, a white frame,
    // and its own sound on top of the hit.
    this.enemyHurt = crits ? 0.5 : 0.3;
    this.shake = crits ? 0.42 : 0.22;
    if (crits) { this.flash = 0.45; this.critFlash = 0.5; }
    Audio_.sfx(kind === 'physical' ? 'hit' : 'psy');
    if (crits) Audio_.sfx('crit');
    if (hits > 1) {
      this.push(crits
        ? `${hits} hits, ${crits} critical! ${total} damage.`
        : `${hits} hits! ${total} damage.`);
    } else {
      this.push(crits ? `CRITICAL HIT! ${total} damage.` : `${total} damage.`);
    }

    // Gut Check knocks a step off their attack when it lands.
    if (move.name === 'Gut Check' && Math.random() < 0.4) this.bumpStage('enemy', 'atk', -1);

    if (move.drain_fraction) {
      const back = Math.round(total * move.drain_fraction);
      Player.hp = Math.min(Player.maxHp, Player.hp + back);
      this.push(`Drained ${back} HP.`);
    }
