<title>Overgrowth</title>

<style>
  /* Committed to a single dark world on purpose: the game is underlit, its
     corners go to actual black, and a light ground would fight every frame of
     it. The page is the cabinet the screen sits in. */
  :root {
    color-scheme: dark;
    --ground: #07070a;      /* near-black, faint blue bias — the void */
    --surface: #0d0d11;
    --hairline: #1c1c24;
    --ink: #d8d4c8;         /* the game's text colour */
    --ink-dim: #6e6e79;     /* cool-biased grey, not neutral */
    --ink-faint: #3a3a44;
    --grass: #6f9247;       /* the one accent: grass where it shouldn't be */
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--ground);
    color: var(--ink-dim);
    font: 400 13px/1.6 ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding: 28px 16px 36px;
    /* grass, bleeding up from under the building */
    background-image:
      radial-gradient(120% 60% at 50% 118%, rgba(111, 146, 71, 0.10), transparent 62%);
  }

  #wrap { width: 100%; max-width: 960px; }

  canvas#screen {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 16 / 9;
    image-rendering: pixelated;
    background: #000;
    border: 1px solid var(--hairline);
    box-shadow:
      0 0 0 1px rgba(0, 0, 0, 0.6),
      0 24px 60px -28px rgba(0, 0, 0, 0.95),
      0 0 90px -50px rgba(111, 146, 71, 0.5);
    touch-action: none;
    outline: none;
  }
  canvas#screen:focus-visible { border-color: var(--grass); }

  footer {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 7px 14px;
    max-width: 720px;
  }

  kbd {
    display: inline-block;
    min-width: 22px;
    padding: 3px 6px;
    border: 1px solid var(--hairline);
    border-bottom-width: 2px;
    border-radius: 3px;
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    font-size: 11px;
    line-height: 1.1;
    text-align: center;
  }

  .key { display: inline-flex; align-items: baseline; gap: 6px; white-space: nowrap; }
  .key span { font-size: 11px; letter-spacing: 0.06em; }

  .meta {
    display: flex;
    gap: 10px;
    align-items: center;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .meta b { color: var(--ink-dim); font-weight: 400; }

  #audio-note { color: var(--ink-faint); }
  #audio-note[data-on="1"] { color: var(--grass); }

  @media (max-width: 560px) {
    body { gap: 16px; padding: 16px 10px 24px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>

<div id="wrap">

</div>

// ===== 10_engine.js ==============================================
// ---------------------------------------------------------------- engine
// Canvas, input, frame loop, and a small WebAudio synth. No assets: every
// pixel is drawn and every sound is generated at runtime, so the whole game
// is one self-contained file.

const W = 320, H = 180;
const cv = document.getElementById('screen');
const cx = cv.getContext('2d');
cx.imageSmoothingEnabled = false;

// --- input -------------------------------------------------------------
const KEYMAP = {
  ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
  w: 'up', s: 'down', a: 'left', d: 'right',
  W: 'up', S: 'down', A: 'left', D: 'right',
  z: 'ok', Z: 'ok', Enter: 'ok', ' ': 'ok',
  x: 'no', X: 'no', Escape: 'no', Backspace: 'no',
  c: 'menu', C: 'menu',
};
const held = {}, pressed = {}, consumed = {};

addEventListener('keydown', e => {
  const k = KEYMAP[e.key];
  if (!k) return;
  e.preventDefault();
  if (!held[k]) pressed[k] = true;
  held[k] = true;
});
addEventListener('keyup', e => {
  const k = KEYMAP[e.key];
  if (!k) return;
  e.preventDefault();
  held[k] = false;
});
addEventListener('blur', () => { for (const k in held) held[k] = false; });

const Input = {
  down: k => !!held[k],
  hit(k) { if (pressed[k] && !consumed[k]) { consumed[k] = true; return true; } return false; },
  // Held-with-repeat, for menus.
  repeat(k, state, delay = 0.28, rate = 0.08) {
    if (this.hit(k)) { state[k] = -delay; return true; }
    if (!held[k]) { state[k] = 0; return false; }
    state[k] = (state[k] || 0) + Time.dt;
    if (state[k] >= rate) { state[k] = 0; return true; }
    return false;
  },
  endFrame() { for (const k in pressed) { pressed[k] = false; consumed[k] = false; } },
};

// Touch: drag the left half to move, tap the right half to confirm.
let touchOrigin = null;
cv.addEventListener('touchstart', e => {
  e.preventDefault(); Audio_.unlock();
  const t = e.changedTouches[0], r = cv.getBoundingClientRect();
  if (t.clientX - r.left < r.width / 2) touchOrigin = { x: t.clientX, y: t.clientY };
  else { pressed.ok = true; held.ok = true; setTimeout(() => held.ok = false, 60); }
}, { passive: false });
cv.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!touchOrigin) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchOrigin.x, dy = t.clientY - touchOrigin.y, dead = 14;
  held.left = dx < -dead; held.right = dx > dead;
  held.up = dy < -dead; held.down = dy > dead;
}, { passive: false });
cv.addEventListener('touchend', e => {
  e.preventDefault(); touchOrigin = null;
  held.left = held.right = held.up = held.down = false;
}, { passive: false });

// Everything is oscillators and filtered noise. Town music is warm and
// slightly detuned; liminal rooms get a single sustained tone and a hum.
const Audio_ = {
  ac: null, master: null, musicGain: null, sfxGain: null,
  current: null, seq: null, seqStep: 0, seqTime: 0, drones: [],

  unlock() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ac = new AC();
    this.master = this.ac.createGain(); this.master.gain.value = 0.34;
    this.master.connect(this.ac.destination);
    this.musicGain = this.ac.createGain(); this.musicGain.gain.value = 0.5;
    this.musicGain.connect(this.master);
    this.sfxGain = this.ac.createGain(); this.sfxGain.gain.value = 0.9;
    this.sfxGain.connect(this.master);
    const note = document.getElementById('audio-note');
    if (note) { note.textContent = 'Sound on'; note.dataset.on = '1'; }
    if (this.pendingTrack) this.play(this.pendingTrack);
  },

  tone(freq, dur, { type = 'square', gain = 0.2, dest = null, detune = 0, attack = 0.005 } = {}) {
    if (!this.ac) return;
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type; o.frequency.value = freq; o.detune.value = detune;
    const now = this.ac.currentTime;
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(gain, now + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    o.connect(g); g.connect(dest || this.sfxGain);
    o.start(now); o.stop(now + dur + 0.02);
  },

  noise(dur, { gain = 0.15, freq = 1200, q = 1 } = {}) {
    if (!this.ac) return;
    const n = Math.floor(this.ac.sampleRate * dur);
    const buf = this.ac.createBuffer(1, n, this.ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = this.ac.createBufferSource(); src.buffer = buf;
    const f = this.ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    const g = this.ac.createGain(); g.gain.value = gain;
    src.connect(f); f.connect(g); g.connect(this.sfxGain);
    src.start();
  },

  sfx(name) {
    if (!this.ac) return;
    switch (name) {
      case 'blip':   this.tone(660, 0.05, { gain: 0.10, type: 'square' }); break;
      case 'ok':     this.tone(880, 0.07, { gain: 0.12 }); break;
      case 'cancel': this.tone(300, 0.08, { gain: 0.10 }); break;
      case 'step':   this.noise(0.05, { gain: 0.035, freq: 500, q: 1.4 }); break;
      case 'water':  this.noise(0.13, { gain: 0.06, freq: 1900, q: 0.7 }); break;
      case 'hit':    this.noise(0.16, { gain: 0.22, freq: 340, q: 0.8 });
                     this.tone(150, 0.14, { gain: 0.16, type: 'sawtooth' }); break;
      case 'hurt':   this.tone(190, 0.20, { gain: 0.18, type: 'sawtooth' });
                     this.tone(95, 0.26, { gain: 0.13, type: 'square' }); break;
      case 'psy':    for (let i = 0; i < 5; i++)
                       setTimeout(() => this.tone(720 + i * 190, 0.11, { gain: 0.09, type: 'sine' }), i * 34);
                     break;
      case 'heal':   [523, 659, 784, 1047].forEach((f, i) =>
                       setTimeout(() => this.tone(f, 0.16, { gain: 0.10, type: 'triangle' }), i * 55));
                     break;
      case 'levelup':[523, 659, 784, 1047, 1319].forEach((f, i) =>
                       setTimeout(() => this.tone(f, 0.24, { gain: 0.12, type: 'square' }), i * 85));
                     break;
      case 'door':   this.noise(0.30, { gain: 0.13, freq: 220, q: 0.5 }); break;
      case 'slam':   this.noise(0.45, { gain: 0.30, freq: 120, q: 0.4 });
                     this.tone(60, 0.4, { gain: 0.2, type: 'square' }); break;
      case 'win':    [659, 784, 988, 1319].forEach((f, i) =>
                       setTimeout(() => this.tone(f, 0.3, { gain: 0.13 }), i * 110));
                     break;
      case 'found':  [880, 1175].forEach((f, i) =>
                       setTimeout(() => this.tone(f, 0.22, { gain: 0.12, type: 'triangle' }), i * 90));
                     break;
      case 'wrong':  this.tone(120, 0.35, { gain: 0.16, type: 'sawtooth' }); break;
    }
  },

  // --- music -----------------------------------------------------------
  // Tracks are step sequences of semitone offsets; null is a rest.
  play(name) {
    if (!this.ac) { this.pendingTrack = name; return; }
    if (this.current === name) return;
    this.current = name;
    this.stopDrones();
    const t = TRACKS[name];
    this.seq = t || null; this.seqStep = 0; this.seqTime = 0;
    if (t && t.drones) t.drones.forEach(d => this.drone(d.freq, d.gain, d.type));
  },

  drone(freq, gain, type = 'sine') {
    if (!this.ac) return;
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, this.ac.currentTime);
    g.gain.exponentialRampToValueAtTime(gain, this.ac.currentTime + 1.4);
    o.connect(g); g.connect(this.musicGain); o.start();
    this.drones.push({ o, g });
  },

  stopDrones() {
    if (!this.ac) return;
    for (const d of this.drones) {
      d.g.gain.cancelScheduledValues(this.ac.currentTime);
      d.g.gain.setValueAtTime(d.g.gain.value, this.ac.currentTime);
      d.g.gain.exponentialRampToValueAtTime(0.0001, this.ac.currentTime + 0.5);
      d.o.stop(this.ac.currentTime + 0.6);
    }
    this.drones = [];
  },

  update(dt) {
    if (!this.ac || !this.seq || !this.seq.steps) return;
    this.seqTime += dt;
    const step = 60 / this.seq.bpm / 2;
    while (this.seqTime >= step) {
      this.seqTime -= step;
      const s = this.seq.steps[this.seqStep % this.seq.steps.length];
      if (s !== null && s !== undefined) {
        const f = 220 * Math.pow(2, s / 12);
        this.tone(f, step * (this.seq.legato || 1.7), {
          type: this.seq.type || 'square', gain: this.seq.gain || 0.055,
          dest: this.musicGain, detune: this.seq.detune || 0, attack: 0.02,
        });
        if (this.seq.bass && this.seqStep % 4 === 0) {
          this.tone(f / 4, step * 2.2, { type: 'triangle', gain: 0.05, dest: this.musicGain, attack: 0.02 });
        }
      }
      this.seqStep++;
    }
  },
};

let lastT = performance.now();
function frame(now) {
  Time.dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now; Time.t += Time.dt; Time.frame++;
  Audio_.update(Time.dt);
  Game.update(Time.dt);
  Game.draw();
  Input.endFrame();
  requestAnimationFrame(frame);
}

const GLYPH_CACHE = {};
for (const ch in GLYPHS) GLYPH_CACHE[ch] = GLYPHS[ch].split(',');

function drawChar(ch, x, y, color) {
  const g = GLYPH_CACHE[ch] || GLYPH_CACHE['?'];
  cx.fillStyle = color;
  for (let r = 0; r < FONT_H; r++) {
    const row = g[r];
    for (let c = 0; c < FONT_W; c++) if (row[c] === '1') cx.fillRect(x + c, y + r, 1, 1);
  }
}

function text(str, x, y, color = '#e8e8ee', spacing = 1) {
  let cxp = x;
  for (const ch of String(str)) {
    if (ch !== ' ') drawChar(ch, cxp, y, color);
    cxp += FONT_W + spacing;
  }
  return cxp;
}

function textWidth(str, spacing = 1) { return String(str).length * (FONT_W + spacing) - spacing; }
function textCentered(str, cxPos, y, color, spacing = 1) {
  text(str, Math.round(cxPos - textWidth(str, spacing) / 2), y, color, spacing);
}

// Word-wraps to a pixel width, returning lines.
function wrap(str, maxPx, spacing = 1) {
  const words = String(str).split(' '), lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (textWidth(test, spacing) > maxPx && line) { lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

// --- drawing helpers ---------------------------------------------------
function rect(x, y, w, h, c) { cx.fillStyle = c; cx.fillRect(x | 0, y | 0, w | 0, h | 0); }

// Deterministic per-pixel noise, so texture never shimmers between frames.
function hash2(x, y) {
  let h = (x * 374761393 + y * 668265263) ^ 0x5bf03635;
  h = (h ^ (h >> 13)) * 1274126177;
  return ((h ^ (h >> 16)) >>> 0) / 4294967296;
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.max(0, Math.min(255, ((n >> 16) & 255) + amt));
  const g = Math.max(0, Math.min(255, ((n >> 8) & 255) + amt));
  const b = Math.max(0, Math.min(255, (n & 255) + amt));
  return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
}

// --- sprites -----------------------------------------------------------
// SPR and PAL are generated by tools/gen_sprites.py into 15_sprites.js.
// Palette keys are base36 so a sprite can carry more than ten tones.

function sprite(name, x, y, pal, flip = false, alpha = 1) {
  const s = SPR[name]; if (!s) return;
  const p = PAL[pal] || PAL.player;
  if (alpha < 1) cx.globalAlpha = alpha;
  const w = s[0].length;
  for (let r = 0; r < s.length; r++) {
    for (let c = 0; c < w; c++) {
      const ch = s[r][c];
      if (ch === '.' || ch === ' ') continue;
      const col = p[ch]; if (!col) continue;
      cx.fillStyle = col;
      cx.fillRect((x + (flip ? w - 1 - c : c)) | 0, (y + r) | 0, 1, 1);
    }
  }
  if (alpha < 1) cx.globalAlpha = 1;
}

function spriteWidth(name) { return SPR[name] ? SPR[name][0].length : 0; }
function spriteHeight(name) { return SPR[name] ? SPR[name].length : 0; }

// --- lighting ----------------------------------------------------------
// One dominant source per room, hard falloff, corners going to actual black.
function vignette(strength, cxp = W / 2, cyp = H / 2, radius = 130) {
  if (strength <= 0) return;
  const g = cx.createRadialGradient(cxp, cyp, 8, cxp, cyp, radius);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(0.55, `rgba(0,0,0,${strength * 0.35})`);
  g.addColorStop(1, `rgba(0,0,0,${Math.min(1, strength)})`);
  cx.fillStyle = g; cx.fillRect(0, 0, W, H);
}

function tintScreen(color, alpha) {
  if (alpha <= 0) return;
  cx.globalAlpha = alpha; rect(0, 0, W, H, color); cx.globalAlpha = 1;
}

// Fine grain over everything — the VHS-soft layer the sprites sit against.
function grain(amount = 0.05) {
  if (typeof Options !== 'undefined' && Options.values && !Options.values.grain) return;
  if (amount <= 0) return;
  const step = 2, seed = (Time.frame / 3) | 0;
  cx.globalAlpha = amount;
  cx.fillStyle = '#ffffff';
  for (let y = 0; y < H; y += step) {
    for (let x = 0; x < W; x += step) {
      if (hash2(x + seed * 31, y - seed * 17) > 0.86) cx.fillRect(x, y, 1, 1);
    }
  }
  cx.globalAlpha = 1;
}

// ---------------------------------------------------------------- world
// Tiles, rooms, wandering enemies. Encounters are visible on the overworld
// and avoidable, because in the liminal zones the quiet is the point.

const TS = 16;                       // tile size
const SOLID = new Set(['#', 'T', ' ', '=']);
const WALKWAY = new Set(['P', 'D']);

// --- tile painting -----------------------------------------------------
function paintGrass(x, y, tx, ty, dim) {
  rect(x, y, TS, TS, shade('#3f7a30', dim));
  for (let i = 0; i < 14; i++) {
    const h = hash2(tx * 71 + i, ty * 37 + i * 13);
    const px = x + ((h * TS) | 0), py = y + ((hash2(i, tx * ty + i) * TS) | 0);
    rect(px, py, 1, h > 0.5 ? 2 : 1, shade(h > 0.62 ? '#4f9440' : '#33632a', dim));
  }
}
function paintBrick(x, y, tx, ty, dim) {
  rect(x, y, TS, TS, shade('#3a2622', dim));
  const bh = 4;
  for (let r = 0; r < TS / bh; r++) {
    const off = ((ty * (TS / bh) + r) % 2) ? 8 : 0;
    for (let c = -1; c < 3; c++) {
      const bx = x + off + c * 8, by = y + r * bh;
      const v = hash2(tx * 13 + c + off, ty * 29 + r);
      rect(Math.max(x, bx), by, Math.min(7, x + TS - bx), bh - 1,
           shade(v > 0.72 ? '#8a4739' : v > 0.35 ? '#7d3f34' : '#6d362c', dim));
    }
  }
}
function paintWood(x, y, tx, ty, dim) {
  rect(x, y, TS, TS, shade('#4a3324', dim));
  for (let c = 0; c < TS; c += 4) {
    rect(x + c, y, 3, TS, shade(hash2(tx * 7 + c, ty) > 0.5 ? '#553a29' : '#4a3324', dim));
    rect(x + c + 3, y, 1, TS, shade('#33231a', dim));
  }
}
function paintWater(x, y, tx, ty, dim) {
  rect(x, y, TS, TS, shade('#2b4a5c', dim));
  const t = Time.t * 0.7;
  for (let i = 0; i < 5; i++) {
    const h = hash2(tx * 17 + i, ty * 23 + i);
    const py = y + ((h * TS) | 0);
    const px = x + (((h * 2 + Math.sin(t + h * 6) * 0.12 + 1) % 1 * TS) | 0);
    rect(px, py, 3, 1, shade('#5d8fa4', dim));
  }
}
function paintCeiling(x, y, tx, ty, dim) {
  rect(x, y, TS, TS, shade('#5a5a52', dim));
  rect(x, y, TS, 1, shade('#3e3e38', dim));
  rect(x, y, 1, TS, shade('#3e3e38', dim));
  for (let i = 0; i < 6; i++) {
    const h = hash2(tx * 31 + i, ty * 11 + i);
    rect(x + ((h * TS) | 0), y + ((hash2(i, tx + ty) * TS) | 0), 1, 1, shade('#6a6a60', dim));
  }
}
function paintCarpet(x, y, tx, ty, dim) {
  rect(x, y, TS, TS, shade('#2a2530', dim));
  for (let i = 0; i < 8; i++) {
    const h = hash2(tx * 41 + i, ty * 19 + i);
    rect(x + ((h * TS) | 0), y + ((hash2(i * 3, tx - ty) * TS) | 0), 1, 1, shade('#332d3a', dim));
  }
}
function paintPath(x, y, tx, ty, dim, overWater) {
  if (overWater) {
    // stepping stones, so a way through the orchard reads as a way through
    paintWater(x, y, tx, ty, dim);
    for (let i = 0; i < 3; i++) {
      const h = hash2(tx * 61 + i, ty * 47 + i);
      const sx = x + 2 + ((h * 9) | 0), sy = y + 2 + ((hash2(i, tx + ty * 3) * 9) | 0);
      rect(sx, sy, 5, 4, shade('#6e6a5e', dim));
      rect(sx, sy, 5, 1, shade('#8a8578', dim));
    }
    return;
  }
  rect(x, y, TS, TS, shade('#6a5a42', dim));
  for (let i = 0; i < 12; i++) {
    const h = hash2(tx * 83 + i, ty * 59 + i);
    rect(x + ((h * TS) | 0), y + ((hash2(i * 7, tx - ty * 2) * TS) | 0), 1, 1,
         shade(h > 0.5 ? '#7d6c4f' : '#57492f', dim));
  }
}
function paintVoid(x, y) { rect(x, y, TS, TS, '#000000'); }
function paintDirt(x, y, tx, ty, dim) {
  rect(x, y, TS, TS, shade('#5a4a36', dim));
  for (let i = 0; i < 10; i++) {
    const h = hash2(tx * 53 + i, ty * 43 + i);
    rect(x + ((h * TS) | 0), y + ((hash2(i * 5, tx * 3 + ty) * TS) | 0), 1, 1,
         shade(h > 0.5 ? '#6a5842' : '#4c3d2c', dim));
  }
}

// --- room runtime ------------------------------------------------------
const World = {
  id: null, room: null, w: 0, h: 0,
  entities: [], camX: 0, camY: 0,

  load(id, at) {
    const r = ROOMS[id];
    if (!r) { console.warn('no room', id); return; }
    this.id = id; this.room = r;
    this.w = r.map[0].length; this.h = r.map.length;
    this.entities = [];

    for (const n of r.npcs || []) {
      this.entities.push({
        kind: 'npc', x: n.x * TS + TS / 2, y: n.y * TS + TS / 2,
        pal: n.pal, key: n.key, shop: n.shop, spr: n.spr, face: 'down', bob: Math.random() * 6,
      });
    }
    // Wandering enemies, only those not already beaten out of this room.
    for (const s of r.spawn || []) {
      for (let i = 0; i < s.n; i++) {
        const spot = this.findFloor();
        if (!spot) continue;
        this.entities.push({
          kind: 'enemy', species: s.name, x: spot[0], y: spot[1],
          vx: 0, vy: 0, think: Math.random() * 1.5, face: 'down',
          hp: 1, cool: 0.9,
        });
      }
    }
    if (r.objects) for (const o of r.objects) {
      if (o.t === 'collectible' && Player.flags['got_' + o.which]) continue;
      this.entities.push({ kind: 'object', ...o, x: o.x * TS + TS / 2, y: o.y * TS + TS / 2 });
    }

    const start = at || r.start;
    Player.x = start[0] * TS + TS / 2;
    Player.y = start[1] * TS + TS / 2;
    this.exitArmed = false;
    Audio_.play(r.music || 'none');
    this.centerCamera();
  },

  findFloor() {
    for (let tries = 0; tries < 80; tries++) {
      const tx = 1 + ((Math.random() * (this.w - 2)) | 0);
      const ty = 1 + ((Math.random() * (this.h - 2)) | 0);
      if (this.solidTile(tx, ty)) continue;
      const px = tx * TS + TS / 2, py = ty * TS + TS / 2;
      if (Math.hypot(px - Player.x, py - Player.y) < 56) continue;
      return [px, py];
    }
    return null;
  },

  tile(tx, ty) {
    if (ty < 0 || ty >= this.h) return '#';
    const row = this.room.map[ty];
    if (tx < 0 || tx >= row.length) return '#';
    return row[tx];
  },
  solidTile(tx, ty) { return SOLID.has(this.tile(tx, ty)); },
  solidAt(px, py) { return this.solidTile(Math.floor(px / TS), Math.floor(py / TS)); },

  // Axis-separated box collision so walls slide rather than stick.
  move(e, dx, dy, hw = 4, hh = 3) {
    if (dx) {
      const nx = e.x + dx;
      if (!this.solidAt(nx + Math.sign(dx) * hw, e.y) &&
          !this.solidAt(nx + Math.sign(dx) * hw, e.y - hh)) e.x = nx;
    }
    if (dy) {
      const ny = e.y + dy;
      if (!this.solidAt(e.x - hw + 1, ny + Math.sign(dy) * hh) &&
          !this.solidAt(e.x + hw - 1, ny + Math.sign(dy) * hh)) e.y = ny;
    }
    e.x = Math.max(2, Math.min(this.w * TS - 2, e.x));
    e.y = Math.max(2, Math.min(this.h * TS - 2, e.y));
  },

  centerCamera() {
    this.camX = Math.round(Math.max(0, Math.min(this.w * TS - W, Player.x - W / 2)));
    this.camY = Math.round(Math.max(0, Math.min(this.h * TS - H, Player.y - H / 2)));
    if (this.w * TS < W) this.camX = Math.round((this.w * TS - W) / 2);
    if (this.h * TS < H) this.camY = Math.round((this.h * TS - H) / 2);
  },

  exitAt(px, py) {
    for (const x of this.room.exits || []) {
      const w = x.w || 1, h = x.h || 1;
      if (px >= x.x * TS && px < (x.x + w) * TS &&
          py >= x.y * TS && py < (x.y + h) * TS) return x;
    }
    return null;
  },

  // An exit cannot fire until the player has stood clear of every exit since
  // arriving. Without this, landing on or beside a return path bounces you
  // straight back, and every doorway in the game is one tile from being that
  // bug.
  updateExitArming() {
    if (this.exitArmed) return;
    if (!this.exitAt(Player.x, Player.y)) this.exitArmed = true;
  },

  update(dt) {
    for (const e of this.entities) {
      if (e.kind === 'npc') { e.bob += dt; continue; }
      if (e.kind !== 'enemy') continue;
      e.cool -= dt;
      e.think -= dt;
      if (e.think <= 0) {
        e.think = 0.7 + Math.random() * 1.6;
        const dir = (Math.random() * 5) | 0;
        const sp = 15;
        e.vx = [0, sp, -sp, 0, 0][dir]; e.vy = [0, 0, 0, sp, -sp][dir];
        if (e.vx) e.face = e.vx > 0 ? 'right' : 'left';
        else if (e.vy) e.face = e.vy > 0 ? 'down' : 'up';
      }
      this.move(e, e.vx * dt, e.vy * dt, 5, 4);
    }
    this.updateExitArming();
    this.centerCamera();
  },

  touchedEnemy() {
    for (const e of this.entities) {
      if (e.kind !== 'enemy' || e.cool > 0) continue;
      if (Math.abs(e.x - Player.x) < 10 && Math.abs(e.y - Player.y) < 11) return e;
    }
    return null;
  },

  // Whatever the player is facing, within reach.
  facing() {
    const d = { up: [0, -12], down: [0, 12], left: [-12, 0], right: [12, 0] }[Player.face];
    const fx = Player.x + d[0], fy = Player.y + d[1];
    let best = null, bestD = 15;
    for (const e of this.entities) {
      if (e.kind === 'enemy') continue;
      const dist = Math.hypot(e.x - fx, e.y - fy);
      if (dist < bestD) { bestD = dist; best = e; }
    }
    return best;
  },

  draw() {
    const r = this.room;
    const dim = r.bright ? 8 : (r.dark ? -46 : -22);
    const x0 = Math.floor(this.camX / TS), x1 = Math.ceil((this.camX + W) / TS);
    const y0 = Math.floor(this.camY / TS), y1 = Math.ceil((this.camY + H) / TS);
    const floorFn = FLOORS[r.floor] || paintGrass;
    const wallFn = WALLS[r.wall] || paintBrick;

    for (let ty = y0; ty <= y1; ty++) {
      for (let tx = x0; tx <= x1; tx++) {
        const px = tx * TS - this.camX, py = ty * TS - this.camY;
        const t = this.tile(tx, ty);
        if (t === ' ') { paintVoid(px, py); continue; }
        if (t === '#') { wallFn(px, py, tx, ty, dim); continue; }
        if (t === 'P') { paintPath(px, py, tx, ty, dim, r.floor === 'water'); continue; }
        if (t === 'D') {
          // a doorway punched through the wall it sits in
          wallFn(px, py, tx, ty, dim - 14);
          rect(px + 3, py + 2, TS - 6, TS - 2, shade('#3b3b42', dim));
          rect(px + 4, py + 3, TS - 8, TS - 3, shade('#8a8a92', dim));
          rect(px + TS - 6, py + 9, 1, 2, '#2a2a30');
          continue;
        }
        if (t === '~') { paintWater(px, py, tx, ty, dim); continue; }
        floorFn(px, py, tx, ty, dim);
        if (t === 'T') {
          const nm = r.floor === 'water' ? 'bigtree' : 'tree';
          sprite(nm, px + (TS - spriteWidth(nm)) / 2, py - spriteHeight(nm) + TS + 2,
                 r.floor === 'water' ? 'tree' : 'bigtree');
        }
        if (t === '=') rect(px + 1, py + 3, TS - 2, TS - 6, shade('#4a3a2a', dim));
      }
    }

    // Everything that stands up, sorted by depth.
    const drawables = [...this.entities, { kind: 'player', x: Player.x, y: Player.y }];
    drawables.sort((a, b) => a.y - b.y);
    for (const e of drawables) this.drawEntity(e);
  },

  drawEntity(e) {
    const px = Math.round(e.x - this.camX), py = Math.round(e.y - this.camY);
    if (e.kind === 'player') { Player.draw(px, py); return; }

    if (e.kind === 'npc') {
      const nm = e.spr || 'villager';
      const w = spriteWidth(nm), h = spriteHeight(nm);
      const bob = Math.sin(e.bob * 1.6) > 0.94 ? 1 : 0;
      rect(px - 4, py + 1, 9, 2, 'rgba(0,0,0,0.28)');
      sprite(e.spr || 'villager', px - w / 2, py - h + 3 - bob, e.pal);
      return;
    }

    if (e.kind === 'enemy') {
      const art = ENEMY_ART[e.species] || { spr: 'dog', pal: 'dog' };
      const w = spriteWidth(art.spr), h = spriteHeight(art.spr);
      rect(px - 4, py + 1, 9, 2, 'rgba(0,0,0,0.28)');
      const bob = Math.sin(Time.t * 3 + e.x) > 0.6 ? 1 : 0;
      sprite(art.spr, px - w / 2, py - h + 3 - bob, art.pal, e.face === 'left');
      return;
    }

    if (e.kind === 'object') this.drawObject(e, px, py);
  },

  drawObject(o, px, py) {
    switch (o.t) {
      case 'bed':
        rect(px - 7, py - 12, 15, 20, '#5a4038');
        rect(px - 6, py - 10, 13, 9, '#c8c0b4');
        rect(px - 6, py + 1, 13, 6, '#8a5a52');
        break;
      case 'dresser':
        rect(px - 7, py - 10, 15, 16, '#4a3628');
        rect(px - 5, py - 7, 11, 4, '#3a2a1e'); rect(px - 5, py - 1, 11, 4, '#3a2a1e');
        break;
      case 'window': {
        rect(px - 9, py - 12, 19, 16, '#2a2a34');
        rect(px - 7, py - 10, 15, 12, '#0d1018');
        rect(px - 1, py - 10, 1, 12, '#2a2a34'); rect(px - 7, py - 5, 15, 1, '#2a2a34');
        break;
      }
      case 'poster':
        rect(px - 6, py - 12, 13, 15, '#3a3550');
        rect(px - 4, py - 10, 9, 11, '#4d4770');
        rect(px - 2, py - 7, 5, 5, '#6b62a0');
        break;
      case 'switch':
        rect(px - 2, py - 8, 5, 7, '#c8c8c0'); rect(px - 1, py - 6, 3, 3, '#8a8a84');
        break;
      case 'door': {
        rect(px - 7, py - 5, 15, 18, '#2a1e16');
        rect(px - 6, py - 4, 13, 16, '#523d2c');
        rect(px - 6, py - 4, 3, 16, '#634b36');
        rect(px - 4, py - 1, 9, 6, '#412f22');
        rect(px + 3, py + 6, 2, 2, '#c8b46a');
        if (Player.flags.hallLight !== false) {
          // The only light in the room, and it is not for him.
          rect(px - 6, py + 12, 13, 1, '#ffeec2');
          rect(px - 6, py + 13, 13, 1, 'rgba(255,232,176,0.75)');
          const g = cx.createLinearGradient(0, py + 13, 0, py + 34);
          g.addColorStop(0, 'rgba(255,226,160,0.30)');
          g.addColorStop(1, 'rgba(255,226,160,0)');
          cx.fillStyle = g;
          cx.beginPath();
          cx.moveTo(px - 7, py + 13); cx.lineTo(px + 8, py + 13);
          cx.lineTo(px + 15, py + 34); cx.lineTo(px - 14, py + 34);
          cx.closePath(); cx.fill();
        }
        break;
      }
      case 'well':
        rect(px - 8, py - 6, 17, 11, '#6a6a66');
        rect(px - 6, py - 4, 13, 7, '#14141a');
        rect(px - 8, py - 16, 2, 11, '#5a4230'); rect(px + 7, py - 16, 2, 11, '#5a4230');
        rect(px - 9, py - 17, 19, 2, '#5a4230');
        break;
      case 'memorial':
        rect(px - 5, py - 20, 11, 22, '#7a7a76');
        rect(px - 7, py, 15, 4, '#5f5f5c');
        for (let i = 0; i < 7; i++) rect(px - 3, py - 17 + i * 2, 7, 1, '#585854');
        break;
      case 'painting': {
        const big = !o.small;
        const w = big ? 22 : 15, h = big ? 20 : 14;
        rect(px - w / 2 - 2, py - h - 2, w + 4, h + 4, '#3a2c18');
        rect(px - w / 2 - 1, py - h - 1, w + 2, h + 2, '#8a6a34');
        rect(px - w / 2, py - h, w, h, '#2a3550');
        rect(px - w / 2, py - h, w, h * 0.55, '#54608c');
        rect(px - w / 2, py - h * 0.45, w, h * 0.45, '#1e2740');
        const cxp = px, base = py - h * 0.45;
        cx.fillStyle = '#9a9a9e';
        if (o.shape === 'obelisk') cx.fillRect(cxp - 1, base - h * 0.44, 3, h * 0.44);
        if (o.shape === 'spire') cx.fillRect(cxp - 1, base - h * 0.5, 2, h * 0.5);
        if (o.shape === 'cube') cx.fillRect(cxp - 4, base - 8, 8, 8);
        if (o.shape === 'sphere') { cx.beginPath(); cx.arc(cxp, base - 5, 4.5, 0, 7); cx.fill(); }
        if (o.shape === 'pyramid') {
          cx.beginPath(); cx.moveTo(cxp, base - 9); cx.lineTo(cxp + 6, base); cx.lineTo(cxp - 6, base);
          cx.closePath(); cx.fill();
        }
        cx.globalAlpha = 0.3;
        if (o.shape === 'cube') cx.fillRect(cxp - 4, base, 8, 5);
        else cx.fillRect(cxp - 3, base, 6, 5);
        cx.globalAlpha = 1;
        break;
      }
      case 'note':
        rect(px - 4, py - 6, 9, 7, '#d8d2c0'); rect(px - 3, py - 5, 7, 1, '#8a8478');
        rect(px - 3, py - 3, 5, 1, '#8a8478');
        break;
      case 'collectible': {
        // The grass is thicker here. Nothing says so.
        const g = 0.5 + 0.5 * Math.sin(Time.t * 2);
        cx.globalAlpha = 0.5 + g * 0.3;
        rect(px - 2, py - 4, 4, 4, '#e8e2d0');
        cx.globalAlpha = 1;
        break;
      }
    }
  },
};

// ===== 40_dialogue.js ============================================
// ---------------------------------------------------------------- dialogue & player
// Text boxes get a distinct treatment per speaker class. The Custodian's box
// degrades and has no advance prompt: the player does not control when he is
// finished.

const BOX_STYLE = {
  npc:       { font: '#f0ece2', border: '#e8e4da', bg: 'rgba(10,10,14,0.94)', prompt: true },
  system:    { font: '#cfe0e8', border: '#8fa8b4', bg: 'rgba(6,10,14,0.94)', prompt: true },
  vixtry:    { font: '#cfe0e8', border: '#8fa8b4', bg: 'rgba(6,10,14,0.94)', prompt: true },
  custodian: { font: '#ffffff', border: '#ffffff', bg: 'rgba(0,0,0,0.97)', prompt: false, degrade: true },
};

const Dialogue = {
  queue: [], page: null, chars: 0, done: false, hold: 0, active: false,
  onFinish: null,

  say(pages, onFinish) {
    if (typeof pages === 'string') pages = [{ text: pages, speaker: 'npc' }];
    pages = pages.map(p => (typeof p === 'string' ? { text: p, speaker: 'npc' } : p));
    this.queue = pages.slice();
    this.onFinish = onFinish || null;
    this.active = true;
    this.next();
  },

  next() {
    if (!this.queue.length) {
      this.active = false; this.page = null;
      const f = this.onFinish; this.onFinish = null;
      if (f) f();
      return;
    }
    this.page = this.queue.shift();
    this.page.lines = wrap(this.page.text, W - 24);
    this.chars = 0; this.done = false;
    this.hold = this.page.speaker === 'custodian' ? 2.6 : 0;
  },

  update(dt) {
    if (!this.active || !this.page) return;
    const total = this.page.lines.join('').length;
    const mult = [0.6, 1, 1.7][(typeof Options !== 'undefined' && Options.values.textSpeed) ?? 1] || 1;
    const speed = (this.page.speaker === 'custodian' ? 44 : 62) * mult;
    if (!this.done) {
      const before = this.chars | 0;
      this.chars = Math.min(total, this.chars + speed * dt);
      if ((this.chars | 0) > before && Time.frame % 2 === 0) Audio_.sfx('blip');
      if (this.chars >= total) this.done = true;
      if (Input.hit('ok')) { this.chars = total; this.done = true; }
      return;
    }
    if (this.page.speaker === 'custodian') {
      this.hold -= dt;
      if (this.hold <= 0) this.next();
      return;
    }
    if (Input.hit('ok')) { Audio_.sfx('ok'); this.next(); }
  },

  draw() {
    if (!this.active || !this.page) return;
    const st = BOX_STYLE[this.page.speaker] || BOX_STYLE.npc;
    const lines = this.page.lines;
    const boxH = Math.max(38, 12 + lines.length * 10);
    const y = H - boxH - 4;
    rect(6, y, W - 12, boxH, st.bg);
    rect(6, y, W - 12, 1, st.border); rect(6, y + boxH - 1, W - 12, 1, st.border);
    rect(6, y, 1, boxH, st.border); rect(W - 7, y, 1, boxH, st.border);

    let remaining = this.chars | 0;
    for (let i = 0; i < lines.length; i++) {
      const full = lines[i];
      const show = full.slice(0, Math.max(0, remaining));
      remaining -= full.length;
      // The Custodian's box loses its kerning as it goes.
      const spacing = st.degrade ? (i % 2 ? 0 : 2) : 1;
      text(show, 12, y + 7 + i * 10, st.font, spacing);
      if (remaining <= 0) break;
    }

    if (this.page.name) {
      rect(10, y - 9, textWidth(this.page.name) + 8, 10, st.bg);
      text(this.page.name, 14, y - 8, st.border);
    }
    if (this.done && st.prompt && Math.sin(Time.t * 5) > 0) {
      text('>', W - 16, y + boxH - 11, st.font);
    }
  },
};

// --- player ------------------------------------------------------------
const Player = {
  name: 'KID', x: 0, y: 0, face: 'down', walkT: 0, moving: false,
  level: 1, exp: 0, hp: 30, pp: 10, sp: 8, money: 0,
  bag: {}, flags: {}, collectibles: 0, notes: [],
  stepAcc: 0,

  statAt(level, stat) {
    const keys = Object.keys(DATA.statCurve).map(Number).sort((a, b) => a - b);
    let lo = keys[0], hi = keys[keys.length - 1];
    for (const k of keys) { if (k <= level) lo = k; }
    for (let i = keys.length - 1; i >= 0; i--) { if (keys[i] >= level) hi = keys[i]; }
    if (lo === hi) return DATA.statCurve[lo][stat];
    const t = (level - lo) / (hi - lo);
    return Math.round(DATA.statCurve[lo][stat] + t * (DATA.statCurve[hi][stat] - DATA.statCurve[lo][stat]));
  },
  get maxHp() { return this.statAt(this.level, 'HP'); },
  get maxPp() { return this.statAt(this.level, 'PP'); },
  get maxSp() { return this.statAt(this.level, 'SP'); },
  get atk()   { return this.statAt(this.level, 'ATK'); },
  get spatk() { return this.statAt(this.level, 'SPATK'); },
  get def()   { return this.statAt(this.level, 'DEF'); },
  get spdef() { return this.statAt(this.level, 'SPDEF'); },
  get spd()   { return this.statAt(this.level, 'SPD'); },

  moves(kind) {
    return DATA.moves[kind].filter(m => m.level <= this.level);
  },

  expToReach(n) { return Math.round(1.2 * n * n * n); },

  gainExp(amount) {
    this.exp += amount;
    const gained = [];
    while (this.level < DATA.levelCap && this.exp >= this.expToReach(this.level + 1)) {
      this.level++;
      gained.push(this.level);
    }
    if (gained.length) {
      this.hp = this.maxHp; this.pp = this.maxPp; this.sp = this.maxSp;
    }
    return gained;
  },

  // Moves learned across a span of levels, for the level-up message.
  movesLearnedAt(level) {
    const out = [];
    for (const k of ['physical', 'special'])
      for (const m of DATA.moves[k]) if (m.level === level) out.push(m.name);
    return out;
  },

  addItem(name, n = 1) { this.bag[name] = (this.bag[name] || 0) + n; },
  useItem(name) {
    if (!this.bag[name]) return false;
    this.bag[name]--; if (!this.bag[name]) delete this.bag[name];
    return true;
  },
  restore() { this.hp = this.maxHp; this.pp = this.maxPp; this.sp = this.maxSp; },

  update(dt) {
    if (Dialogue.active || Game.mode !== 'field') { this.moving = false; return; }
    const sp = 62;
    let dx = 0, dy = 0;
    if (Input.down('left')) dx -= 1;
    if (Input.down('right')) dx += 1;
    if (Input.down('up')) dy -= 1;
    if (Input.down('down')) dy += 1;
    if (dx && dy) { dx *= 0.707; dy *= 0.707; }
    this.moving = !!(dx || dy);
    if (dx) this.face = dx > 0 ? 'right' : 'left';
    else if (dy) this.face = dy > 0 ? 'down' : 'up';
    if (this.moving) {
      World.move(this, dx * sp * dt, dy * sp * dt);
      this.walkT += dt * 8;
      this.stepAcc += dt;
      const interval = 0.32;
      if (this.stepAcc > interval) {
        this.stepAcc = 0;
        Audio_.sfx(World.room.floor === 'water' ? 'water' : 'step');
      }
    } else { this.walkT = 0; this.stepAcc = 0.3; }
  },

  draw(px, py) {
    const name = this.face === 'up' ? 'player_up'
               : this.face === 'down' ? 'player_down' : 'player_side';
    const w = spriteWidth(name), h = spriteHeight(name);
    const bob = this.moving && Math.sin(this.walkT) > 0 ? 1 : 0;
    rect(px - 5, py + 1, 11, 2, 'rgba(0,0,0,0.32)');
    sprite(name, px - w / 2, py - h + 3 - bob, 'player', this.face === 'left');
  },
};


// ===== 50_battle.js ==============================================
// ---------------------------------------------------------------- battle
// Turn-based, one combatant, no party. The camera sits behind the player so
// only the top of his head is in frame; he is never seen taking a hit.

const Battle = {
  active: false, enemy: null, state: 'intro', log: [], logT: 0,
  cursor: 0, sub: null, subCursor: 0, subScroll: 0, rep: {},
  shake: 0, flash: 0, enemyHurt: 0, playerHurt: 0, result: null,
  onEnd: null, backdrop: null, entityRef: null, turn: 0,

  makeEnemy(species, opts = {}) {
    const def = DATA.enemies[species];
    const level = opts.level || (def ? def.level : 5);
    const role = DATA.roles[(def && def.role) || 'standard'];
    const c = DATA.enemyCurve;
    const hpMul = opts.hpMul || 1, atkMul = opts.atkMul || 1;
    const hp = Math.round(
      (c.HP.base + c.HP.per_level * level + c.HP.per_level_squared * level * level) * role.HP * hpMul);
    return {
      species, name: opts.name || species, level,
      boss: !!opts.boss,
      hp, maxHp: hp,
      atk: (c.ATK.base + c.ATK.per_level * level) * role.ATK * atkMul,
      def: (c.DEF.base + c.DEF.per_level * level) * role.DEF,
      spd: (c.SPD.base + c.SPD.per_level * level) * role.SPD,
      power: c.attack_power,
      roleHp: role.HP,
      inaction: (def && def.inaction_rate) || 0,
      inflicts: (def && def.inflicts) || opts.inflicts || null,
      dealsDamage: !(def && def.deals_damage === false),
      art: ENEMY_ART[species] || { spr: 'dog', pal: 'dog' },
      scale: opts.scale || null,
      exp: opts.exp || null,
      restoresOnce: opts.restoresOnce || 0,
      restored: false,
      phase: 1, phases: opts.phases || 1,
    };
  },

  start(enemy, entityRef, onEnd) {
    this.active = true; this.enemy = enemy; this.entityRef = entityRef || null;
    this.state = 'intro'; this.log = []; this.cursor = 0; this.sub = null;
    this.subCursor = 0; this.subScroll = 0; this.turn = 0;
    this.shake = 0; this.flash = 0.5; this.enemyHurt = 0; this.playerHurt = 0;
    this.result = null; this.onEnd = onEnd || null;
    this.homesick = false;
    this.backdrop = { floor: World.room.floor, wall: World.room.wall, bright: World.room.bright };
    Audio_.play(enemy.boss ? 'boss' : 'battle');
    this.push(`${enemy.name.toUpperCase()} appeared.`);
    this.state = 'message';
    this.after = () => { this.state = 'menu'; };
  },

  push(msg) { this.log.push(msg); this.logT = 0; },

  // --- damage ----------------------------------------------------------
  roll(atk, power, def) {
    const raw = (atk * power) / DATA.damage.divisor - def * DATA.damage.defCoeff;
    let dmg = raw * (0.9 + Math.random() * 0.2);
    if (Math.random() < DATA.damage.critChance) dmg = (atk * power) / DATA.damage.divisor * DATA.damage.critMult;
    return Math.max(1, Math.round(dmg));
  },

  canFlee() {
    if (this.enemy.boss) return false;          // shows ??, and ?? is never below yours
    return this.enemy.level <= Player.level;
  },

  // --- player actions --------------------------------------------------
  useMove(kind, move) {
    const pool = kind === 'physical' ? 'pp' : 'sp';
    if (Player[pool] < move.cost) {
      // Not an action: the turn is not spent, and the menu goes back to the top
      // rather than leaving a dead submenu behind.
      Audio_.sfx('wrong');
      this.push('Not enough ' + pool.toUpperCase() + '.');
      this.state = 'message';
      this.after = () => { this.sub = null; this.state = 'menu'; };
      return;
    }
    Player[pool] -= move.cost;
    this.sub = null;
    this.push(move.name.toUpperCase() + '!');

    if (move.heal_fraction) {
      const amt = Math.round(Player.maxHp * move.heal_fraction);
      Player.hp = Math.min(Player.maxHp, Player.hp + amt);
      Audio_.sfx('heal');
      this.push(`Recovered ${amt} HP.`);
      if (move.name === 'Mend+') this.homesick = false;
      this.state = 'message'; this.after = () => this.enemyTurn();
      return;
    }
    if (move.name === 'Quiet Room') {
      this.quiet = 3;
      if (this.homesick) { this.homesick = false; this.push('The room went quiet.'); }
      else this.push('The room went quiet.');
      Audio_.sfx('heal');
      this.state = 'message'; this.after = () => this.enemyTurn();
      return;
    }
    if (!move.power) {
      if (move.inflicts) this.push(`${this.enemy.name} is ${move.inflicts}.`);
      else this.push('Nothing obvious happened.');
      Audio_.sfx('psy');
      this.state = 'message'; this.after = () => this.enemyTurn();
      return;
    }

    const stat = kind === 'physical' ? Player.atk : Player.spatk;
    let hits = move.hits || 1;
    if (Array.isArray(hits)) hits = hits[0] + ((Math.random() * (hits[1] - hits[0] + 1)) | 0);
    let power = move.power;
    if (Array.isArray(power)) {
      const lowHp = 1 - Player.hp / Player.maxHp;
      power = Math.round(power[0] + (power[1] - power[0]) * Math.min(1, lowHp / 0.85));
    }
    if (move.accuracy && Math.random() > move.accuracy) {
      this.push('It missed.');
      Audio_.sfx('wrong');
      this.state = 'message'; this.after = () => this.enemyTurn();
      return;
    }

    let total = 0;
    for (let i = 0; i < hits; i++) total += this.roll(stat, power, this.enemy.def);
    this.enemy.hp -= total;
    this.enemyHurt = 0.3; this.shake = 0.22;
    Audio_.sfx(kind === 'physical' ? 'hit' : 'psy');
    this.push(hits > 1 ? `${hits} hits! ${total} damage.` : `${total} damage.`);

    if (move.drain_fraction) {
      const back = Math.round(total * move.drain_fraction);
      Player.hp = Math.min(Player.maxHp, Player.hp + back);
      this.push(`Drained ${back} HP.`);
    }

    this.state = 'message';
    this.after = () => this.checkEnemy();
  },

  useItem(name) {
    const it = DATA.items[name];
    if (!it) return;
    Player.useItem(name);
    this.sub = null;
    this.push(`Used ${name}.`);
    if (it.heal) {
      const amt = it.heal === 'full' ? Player.maxHp : it.heal;
      const before = Player.hp;
      Player.hp = Math.min(Player.maxHp, Player.hp + amt);
      Audio_.sfx('heal');
      this.push(`Recovered ${Player.hp - before} HP.`);
    } else if (it.pp) { Player.pp = Math.min(Player.maxPp, Player.pp + it.pp); Audio_.sfx('heal'); this.push(`Recovered ${it.pp} PP.`); }
    else if (it.sp) { Player.sp = Math.min(Player.maxSp, Player.sp + it.sp); Audio_.sfx('heal'); this.push(`Recovered ${it.sp} SP.`); }
    else { Audio_.sfx('ok'); this.push('Nothing obvious happened.'); }
    this.state = 'message';
    this.after = () => this.enemyTurn();
  },

  tryFlee() {
    if (!this.canFlee()) {
      this.push(this.enemy.boss
        ? 'The level reads ??. You cannot run.'
        : `${this.enemy.name} is level ${this.enemy.level}. You cannot run.`);
      Audio_.sfx('wrong');
      this.state = 'message'; this.after = () => { this.state = 'menu'; };
      return;
    }
    if (Math.random() < 0.5) {
      this.push('Got away.');
      Audio_.sfx('ok');
      this.result = 'fled';
      this.state = 'message'; this.after = () => this.finish();
    } else {
      this.push("Couldn't get away.");
      Audio_.sfx('wrong');
      this.state = 'message'; this.after = () => this.enemyTurn();
    }
  },

  // --- enemy turn ------------------------------------------------------
  checkEnemy() {
    if (this.enemy.hp > 0) { this.enemyTurn(); return; }
    if (this.enemy.restoresOnce && !this.enemy.restored) {
      this.enemy.restored = true;
      this.enemy.hp = Math.round(this.enemy.maxHp * this.enemy.restoresOnce);
      Audio_.sfx('wrong');
      this.push(`${this.enemy.name} is still standing.`);
      this.state = 'message'; this.after = () => this.enemyTurn();
      return;
    }
    this.victory();
  },

  enemyTurn() {
    this.turn++;
    if (this.quiet > 0) this.quiet--;
    const e = this.enemy;
    if (e.hp <= 0) { this.victory(); return; }

    if (Math.random() < e.inaction || !e.dealsDamage) {
      if (e.inflicts === 'Homesick' && !this.homesick) {
        this.homesick = true;
        this.push(`${e.name} made you think of home.`);
      } else {
        this.push(`${e.name} did nothing.`);
      }
      this.state = 'message'; this.after = () => this.startTurn();
      return;
    }

    if (e.inflicts === 'Homesick' && !this.homesick && Math.random() < 0.6) {
      this.homesick = true;
      this.push(`${e.name} made you think of home.`);
      this.state = 'message'; this.after = () => this.startTurn();
      return;
    }

    let falloff = 1;
    if (e.phases > 1) {
      const done = Math.min(e.phases - 1, Math.floor((1 - e.hp / e.maxHp) * e.phases));
      falloff = Math.max(0.45, 1 - 0.12 * done);
    }
    let dmg = this.roll(e.atk * falloff, e.power, Player.def);
    if (this.quiet > 0) dmg = Math.round(dmg * 0.5);
    Player.hp -= dmg;
    this.playerHurt = 0.35; this.shake = 0.28; this.flash = 0.3;
    Audio_.sfx('hurt');
    this.push(`${e.name} hit you for ${dmg}.`);
    this.state = 'message';
    this.after = () => this.startTurn();
  },

  startTurn() {
    if (Player.hp <= 0) { this.defeat(); return; }
    // The trickle. With Punch at 2 PP this is what guarantees there is never a
    // state where the player has no move at all — see docs/05.
    if (!this.drained) {
      Player.pp = Math.min(Player.maxPp, Player.pp + DATA.regen.PP);
      Player.sp = Math.min(Player.maxSp, Player.sp + DATA.regen.SP);
    }
    if (this.homesick) {
      const chip = Math.max(1, Math.round(Player.maxHp * 0.05));
      Player.hp -= chip;
      this.push(`You can't stop thinking about home. ${chip} damage.`);
      if (Player.hp <= 0) { this.state = 'message'; this.after = () => this.defeat(); return; }
      this.state = 'message'; this.after = () => { this.state = 'menu'; };
      return;
    }
    this.state = 'menu';
  },

  victory() {
    Audio_.sfx('win');
    const e = this.enemy;
    // Catch-up EXP: the game quietly pays more when the player is behind.
    let exp = e.exp;
    if (exp === null) {
      const catchup = Math.min(2, Math.max(0.5, 1 + 0.12 * (e.level - Player.level)));
      exp = Math.round(0.20 * Math.pow(e.level, 2.32) * e.roleHp * catchup);
    }
    const money = Math.round(1 + 1.35 * e.level);
    Player.money += money;
    const levels = Player.gainExp(exp);
    this.result = 'won';
    const msgs = [`${e.name} stopped.`, `${exp} EXP.  ${money} Rell.`];
    this.pendingMsgs = msgs;
    this.pendingLevels = levels;
    this.push(msgs[0]); this.push(msgs[1]);
    for (const lv of levels) {
      this.push(`Level ${lv}.`);
      for (const mv of Player.movesLearnedAt(lv)) this.push(`You learned ${mv.toUpperCase()}.`);
    }
    if (levels.length) setTimeout(() => Audio_.sfx('levelup'), 260);
    this.state = 'message';
    this.after = () => this.finish();
  },

  defeat() {
    this.result = 'lost';
    Audio_.sfx('wrong');
    this.push('You went down.');
    this.state = 'message';
    this.after = () => this.finish();
  },

  finish() {
    this.active = false;
    const r = this.result, ref = this.entityRef, cb = this.onEnd;
    this.onEnd = null;
    if (cb) cb(r, ref);
  },

  // --- update ----------------------------------------------------------
  update(dt) {
    if (!this.active) return;
    this.shake = Math.max(0, this.shake - dt);
    this.flash = Math.max(0, this.flash - dt * 2);
    this.enemyHurt = Math.max(0, this.enemyHurt - dt);
    this.playerHurt = Math.max(0, this.playerHurt - dt);
    this.logT += dt;

    if (this.state === 'message') {
      if (this.log.length > 1) {
        if (this.logT > 0.85 || Input.hit('ok')) { this.log.shift(); this.logT = 0; }
        return;
      }
      if (this.logT > 0.5 || Input.hit('ok')) {
        this.log = []; this.logT = 0;
        const a = this.after; this.after = null;
        if (a) a();
      }
      return;
    }

    if (this.state === 'menu') this.updateMenu();
    else if (this.state === 'sub') this.updateSub();
  },

  updateMenu() {
    if (Input.repeat('left', this.rep) || Input.repeat('right', this.rep)) {
      this.cursor ^= 1; Audio_.sfx('blip');
    }
    if (Input.repeat('up', this.rep) || Input.repeat('down', this.rep)) {
      this.cursor ^= 2; Audio_.sfx('blip');
    }
    if (Input.hit('ok')) {
      Audio_.sfx('ok');
      const which = ['physical', 'special', 'bag', 'run'][this.cursor];
      if (which === 'run') { this.tryFlee(); return; }
      this.sub = which; this.subCursor = 0; this.subScroll = 0; this.state = 'sub';
    }
  },

  subList() {
    if (this.sub === 'physical' || this.sub === 'special') return Player.moves(this.sub);
    return Object.keys(Player.bag)
      .filter(n => DATA.items[n] && DATA.items[n].battle)
      .map(n => ({ name: n, count: Player.bag[n] }));
  },

  updateSub() {
    const list = this.subList();
    if (Input.hit('no')) { Audio_.sfx('cancel'); this.sub = null; this.state = 'menu'; return; }
    if (!list.length) {
      if (Input.hit('ok')) { Audio_.sfx('cancel'); this.sub = null; this.state = 'menu'; }
      return;
    }
    if (Input.repeat('up', this.rep)) { this.subCursor = (this.subCursor - 1 + list.length) % list.length; Audio_.sfx('blip'); }
    if (Input.repeat('down', this.rep)) { this.subCursor = (this.subCursor + 1) % list.length; Audio_.sfx('blip'); }
    const maxRows = 4;
    if (this.subCursor < this.subScroll) this.subScroll = this.subCursor;
    if (this.subCursor >= this.subScroll + maxRows) this.subScroll = this.subCursor - maxRows + 1;
    if (Input.hit('ok')) {
      Audio_.sfx('ok');
      const item = list[this.subCursor];
      if (this.sub === 'bag') this.useItem(item.name);
      else this.useMove(this.sub, item);
    }
  },

  // --- draw ------------------------------------------------------------
  draw() {
    if (!this.active) return;
    const sx = this.shake > 0 ? Math.round((Math.random() - 0.5) * 5) : 0;
    const sy = this.shake > 0 ? Math.round((Math.random() - 0.5) * 4) : 0;
    cx.save(); cx.translate(sx, sy);

    // Backdrop: the room the fight started in, seen from behind the player.
    const b = this.backdrop;
    const dim = b.bright ? -6 : -34;
    const wallFn = WALLS[b.wall] || paintBrick;
    for (let y = 0; y < 6; y++) for (let x = -1; x <= W / TS + 1; x++) wallFn(x * TS, y * TS, x, y, dim - 10);
    const floorFn = FLOORS[b.floor] || paintGrass;
    for (let y = 6; y <= H / TS + 1; y++) for (let x = -1; x <= W / TS + 1; x++) floorFn(x * TS, y * TS, x, y, dim);
    rect(0, 92, W, 2, 'rgba(0,0,0,0.35)');

    // Enemy in the middle distance.
    const e = this.enemy;
    const art = e.art;
    const s = e.scale || Math.max(2, Math.round(46 / spriteHeight(art.spr)));
    const ew = spriteWidth(art.spr) * s, eh = spriteHeight(art.spr) * s;
    const ex = Math.round(W / 2 - ew / 2), ey = Math.round(100 - eh);
    const float = Math.sin(Time.t * 2) * 1.5;
    cx.save();
    cx.translate(ex, ey + float);
    cx.scale(s, s);
    if (this.enemyHurt > 0 && Time.frame % 4 < 2) cx.globalAlpha = 0.35;
    sprite(art.spr, 0, 0, art.pal);
    cx.globalAlpha = 1;
    cx.restore();
    cx.globalAlpha = 0.3;
    rect(W / 2 - ew / 3, 99, (ew / 3) * 2, 3, '#000');
    cx.globalAlpha = 1;

    // Enemy nameplate. Bosses read ??.
    const lvl = e.boss ? '??' : String(e.level);
    const label = `${e.name}   Lv ${lvl}`;
    const lw = Math.min(W - 116, textWidth(label) + 10);
    // Never overlap the player's stat box, which owns the left 102px.
    const nx = Math.max(106, Math.round(W / 2 - lw / 2));
    rect(nx, 10, lw, 13, 'rgba(8,8,12,0.85)');
    rect(nx, 10, lw, 1, '#8a8a94');
    text(e.name, nx + 5, 13, '#e8e8ee');
    text('Lv ' + lvl, nx + lw - textWidth('Lv ' + lvl) - 5, 13,
         e.boss ? '#e8d24a' : '#b8b8c2');
    const hpw = lw - 10;
    rect(nx + 5, 21, hpw, 2, '#2a2a32');
    rect(nx + 5, 21, Math.max(0, hpw * (e.hp / e.maxHp)), 2, '#c05a5a');

    // The player: only the top of his head, at the bottom of frame.
    const headY = 126 + (this.playerHurt > 0 ? Math.sin(Time.t * 60) * 2 : 0);
    cx.save(); cx.translate(W / 2 - 28, headY); cx.scale(4, 4);
    if (this.playerHurt > 0 && Time.frame % 4 < 2) cx.globalAlpha = 0.4;
    sprite('player_up', 0, 0, 'player');
    cx.globalAlpha = 1;
    cx.restore();

    cx.restore();

    if (this.flash > 0) tintScreen('#ff5050', this.flash * 0.35);
    grain(0.05);

    this.drawHud();
    if (this.state === 'message' && this.log.length) this.drawLog();
    else if (this.state === 'menu') this.drawMenu();
    else if (this.state === 'sub') this.drawSub();
  },

  drawHud() {
    const bw = 96, bx = 6, by = 6;
    rect(bx, by, bw, 40, 'rgba(8,8,12,0.86)');
    rect(bx, by, bw, 1, '#8a8a94'); rect(bx, by + 39, bw, 1, '#8a8a94');
    rect(bx, by, 1, 40, '#8a8a94'); rect(bx + bw - 1, by, 1, 40, '#8a8a94');
    text(Player.name.slice(0, 8), bx + 4, by + 3, '#e8e8ee');
    text('Lv' + Player.level, bx + bw - textWidth('Lv' + Player.level) - 4, by + 3, '#b8b8c2');
    const bar = (label, cur, max, y, col) => {
      text(label, bx + 4, y, '#9a9aa4');
      const w = 52, x = bx + 20;
      rect(x, y + 2, w, 3, '#2a2a32');
      rect(x, y + 2, Math.max(0, Math.round(w * Math.max(0, cur) / max)), 3, col);
      text(String(Math.max(0, Math.round(cur))), bx + 76, y, '#cfcfd6');
    };
    bar('HP', Player.hp, Player.maxHp, by + 13, '#5ac06a');
    bar('PP', Player.pp, Player.maxPp, by + 21, '#c8a44a');
    bar('SP', Player.sp, Player.maxSp, by + 29, '#6a8ad0');
    if (this.homesick) text('HOMESICK', bx + 4, by + 44, '#c05a8a');
  },

  boxAt(x, y, w, h) {
    rect(x, y, w, h, 'rgba(8,8,12,0.94)');
    rect(x, y, w, 1, '#c8c8d0'); rect(x, y + h - 1, w, 1, '#c8c8d0');
    rect(x, y, 1, h, '#c8c8d0'); rect(x + w - 1, y, 1, h, '#c8c8d0');
  },

  drawLog() {
    const y = H - 34;
    this.boxAt(6, y, W - 12, 28);
    const lines = wrap(this.log[0], W - 26);
    for (let i = 0; i < Math.min(2, lines.length); i++) text(lines[i], 12, y + 6 + i * 10, '#f0ece2');
  },

  drawMenu() {
    const y = H - 34, x = 6, w = W - 12;
    this.boxAt(x, y, w, 28);
    const labels = ['PHYSICAL', 'SPECIAL', 'BAG', 'RUN'];
    const canRun = this.canFlee();
    for (let i = 0; i < 4; i++) {
      const cxp = x + 14 + (i % 2) * (w / 2 - 8);
      const cyp = y + 6 + ((i / 2) | 0) * 11;
      const greyed = i === 3 && !canRun;
      const col = greyed ? '#5a5a64' : '#f0ece2';
      text(labels[i], cxp, cyp, col);
      if (this.cursor === i) text('>', cxp - 8, cyp, greyed ? '#7a7a84' : '#e8d24a');
    }
  },

  drawSub() {
    const list = this.subList();
    const y = H - 62, x = 6, w = W - 12, h = 56;
    this.boxAt(x, y, w, h);
    if (!list.length) {
      text(this.sub === 'bag' ? 'No battle items.' : 'Nothing here.', x + 12, y + 6, '#9a9aa4');
      return;
    }
    const maxRows = 4;
    for (let i = 0; i < Math.min(maxRows, list.length); i++) {
      const idx = this.subScroll + i;
      if (idx >= list.length) break;
      const m = list[idx];
      const yy = y + 5 + i * 10;
      const cost = m.cost !== undefined
        ? `${m.cost} ${this.sub === 'physical' ? 'PP' : 'SP'}`
        : `x${m.count}`;
      const pool = this.sub === 'physical' ? Player.pp : Player.sp;
      const afford = m.cost === undefined || pool >= m.cost;
      text(m.name.toUpperCase(), x + 14, yy, afford ? '#f0ece2' : '#6a6a74');
      text(cost, x + w - textWidth(cost) - 10, yy, afford ? '#b8b8c2' : '#6a6a74');
      if (idx === this.subCursor) text('>', x + 6, yy, '#e8d24a');
    }
    const sel = list[this.subCursor];
    const desc = sel && (sel.notes || (DATA.items[sel.name] && DATA.items[sel.name].effect) || '');
    if (desc) text(wrap(desc, w - 24)[0], x + 8, y + h - 10, '#8a8a94');
  },
};


// ===== 60_ui.js ==================================================
// ---------------------------------------------------------------- UI
// Title, name entry, pause menu, shop, save. Menu text is monospace-cold and
// never uses contractions; NPC text does, constantly.

const SAVE_KEY = 'overgrowth.save.v1';

const Save = {
  write() {
    const d = {
      name: Player.name, level: Player.level, exp: Player.exp,
      hp: Player.hp, pp: Player.pp, sp: Player.sp, money: Player.money,
      bag: Player.bag, flags: Player.flags, notes: Player.notes,
      collectibles: Player.collectibles, room: World.id,
      x: Math.round(Player.x), y: Math.round(Player.y), stamp: Date.now(),
    };
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(d)); return true; }
    catch (e) { return false; }
  },
  read() {
    try { const s = localStorage.getItem(SAVE_KEY); return s ? JSON.parse(s) : null; }
    catch (e) { return null; }
  },
  clear() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} },
  apply(d) {
    Object.assign(Player, {
      name: d.name, level: d.level, exp: d.exp, hp: d.hp, pp: d.pp, sp: d.sp,
      money: d.money, bag: d.bag || {}, flags: d.flags || {}, notes: d.notes || [],
      collectibles: d.collectibles || 0,
    });
    World.load(d.room || 'okobo');
    Player.x = d.x; Player.y = d.y;
    World.centerCamera();
  },
};

// --- title -------------------------------------------------------------
const Title = {
  cursor: 0, rep: {}, t: 0, hasSave: false, opts: [],
  enter() {
    this.hasSave = !!Save.read();
    this.opts = this.hasSave ? ['CONTINUE', 'NEW GAME', 'OPTIONS'] : ['NEW GAME', 'OPTIONS'];
    this.cursor = 0; this.t = 0;
    Audio_.play('void');
  },
  update(dt) {
    this.t += dt;
    const n = this.opts.length;
    if (Input.repeat('up', this.rep)) { this.cursor = (this.cursor - 1 + n) % n; Audio_.sfx('blip'); }
    if (Input.repeat('down', this.rep)) { this.cursor = (this.cursor + 1) % n; Audio_.sfx('blip'); }
    if (Input.hit('ok')) {
      Audio_.sfx('ok');
      const pick = this.opts[this.cursor];
      if (pick === 'CONTINUE') { Save.apply(Save.read()); Game.mode = 'field'; }
      else if (pick === 'NEW GAME') { Game.mode = 'name'; NameEntry.enter(); }
      else { Options.enter('title'); Game.mode = 'options'; }
    }
  },
  draw() {
    rect(0, 0, W, H, '#05050a');
    // The building, barely resolving out of the black.
    const bx = W / 2 - 56, by = 46;
    for (let y = 0; y < 3; y++) for (let x = 0; x < 7; x++) paintBrick(bx + x * TS, by + y * TS, x, y, -64);
    rect(bx + 50, by + 22, 12, 26, '#2e2e34');
    rect(bx + 51, by + 23, 10, 24, '#53535a');
    // Grass runs off the bottom of frame and dies into black, rather than
    // sitting on screen as a slab with edges.
    const gy = by + 48;
    for (let y = 0; y * TS + gy < H; y++)
      for (let x = -4; x < W / TS + 4; x++) paintGrass(x * TS, gy + y * TS, x, y, -78);
    const fade = cx.createLinearGradient(0, gy - 4, 0, H);
    fade.addColorStop(0, 'rgba(0,0,0,0.15)');
    fade.addColorStop(0.45, 'rgba(0,0,0,0.72)');
    fade.addColorStop(1, 'rgba(0,0,0,0.97)');
    cx.fillStyle = fade; cx.fillRect(0, gy - 4, W, H - gy + 4);

      if (this.cursor === i && Math.sin(this.t * 5) > 0)

};

// --- options -----------------------------------------------------------
const OPT_KEY = 'overgrowth.options.v1';
const Options = {
  cursor: 0, rep: {}, from: 'title',
  values: { textSpeed: 1, volume: 2, flashing: 1, grain: 1 },
  rows: [
    { key: 'textSpeed', label: 'TEXT SPEED', opts: ['SLOW', 'NORMAL', 'FAST'] },
    { key: 'volume',    label: 'VOLUME',     opts: ['OFF', 'LOW', 'NORMAL', 'LOUD'] },
    { key: 'flashing',  label: 'FLASHING',   opts: ['REDUCED', 'NORMAL'] },
    { key: 'grain',     label: 'FILM GRAIN', opts: ['OFF', 'ON'] },
  ],

  load() {
    try {
      const v = JSON.parse(localStorage.getItem(OPT_KEY) || 'null');
      if (v) Object.assign(this.values, v);
    } catch (e) {}
    this.apply();
  },
  save() { try { localStorage.setItem(OPT_KEY, JSON.stringify(this.values)); } catch (e) {} },
  apply() {
    if (Audio_.master) Audio_.master.gain.value = [0, 0.16, 0.34, 0.55][this.values.volume];
  },

  enter(from) { this.from = from || 'title'; this.cursor = 0; },
  update(dt) {
    const n = this.rows.length + 1;                    // rows plus BACK
    if (Input.repeat('up', this.rep)) { this.cursor = (this.cursor - 1 + n) % n; Audio_.sfx('blip'); }
    if (Input.repeat('down', this.rep)) { this.cursor = (this.cursor + 1) % n; Audio_.sfx('blip'); }
    const leave = () => {
      this.save();
      Audio_.sfx('cancel');
      if (this.from === 'title') { Game.mode = 'title'; Title.enter(); }
      else { Game.mode = 'field'; }
    };
    if (Input.hit('no')) { leave(); return; }
    if (this.cursor === this.rows.length) {
      if (Input.hit('ok')) leave();
      return;
    }
    const row = this.rows[this.cursor];
    const step = (d) => {
      const len = row.opts.length;
      this.values[row.key] = (this.values[row.key] + d + len) % len;
      this.apply(); this.save(); Audio_.sfx('blip');
    };
    if (Input.repeat('left', this.rep)) step(-1);
    if (Input.repeat('right', this.rep) || Input.hit('ok')) step(1);
  },
  draw() {
    rect(0, 0, W, H, '#08080c');
    textCentered('OPTIONS', W / 2, 18, '#f0ece2', 2);
    rect(60, 30, W - 120, 1, '#2c2c36');
    for (let i = 0; i < this.rows.length; i++) {
      const r = this.rows[i], y = 44 + i * 16, sel = this.cursor === i;
      text(r.label, 58, y, sel ? '#f0ece2' : '#8a8a94');
      const v = r.opts[this.values[r.key]];
      text('< ' + v + ' >', W - 58 - textWidth('< ' + v + ' >'), y, sel ? '#e8d24a' : '#70707c');
      if (sel) text('>', 46, y, '#e8d24a');
    }
    const by = 44 + this.rows.length * 16 + 8;
    const selBack = this.cursor === this.rows.length;
    textCentered('BACK', W / 2, by, selBack ? '#f0ece2' : '#70707c');
    if (selBack) text('>', W / 2 - textWidth('BACK') / 2 - 10, by, '#e8d24a');
    textCentered('LEFT / RIGHT CHANGE    X BACK', W / 2, H - 14, '#4a4a56');
    grain(0.04);
  },
};

// --- name entry --------------------------------------------------------
const NameEntry = {
  rows: ['ABCDEFGHIJ', 'KLMNOPQRST', 'UVWXYZ.-  '],
  cx: 0, cy: 0, value: '', rep: {}, shake: 0,
  enter() { this.value = ''; this.cx = 0; this.cy = 0; this.shake = 0; },
  update(dt) {
    this.shake = Math.max(0, this.shake - dt * 3);
    if (Input.repeat('left', this.rep)) { this.cx = (this.cx + 9) % 10; Audio_.sfx('blip'); }
    if (Input.repeat('right', this.rep)) { this.cx = (this.cx + 1) % 10; Audio_.sfx('blip'); }
    if (Input.repeat('up', this.rep)) { this.cy = (this.cy + 2) % 3; Audio_.sfx('blip'); }
    if (Input.repeat('down', this.rep)) { this.cy = (this.cy + 1) % 3; Audio_.sfx('blip'); }
    if (Input.hit('no')) {
      this.value = this.value.slice(0, -1); Audio_.sfx('cancel');
    }
    if (Input.hit('ok')) {
      const ch = this.rows[this.cy][this.cx];
      if (ch !== ' ' && this.value.length < 8) { this.value += ch; Audio_.sfx('ok'); }
      else Audio_.sfx('cancel');
    }
    if (Input.hit('menu')) {
      // Confirm. An empty field is refused, and the refusal does not explain itself.
      if (!this.value.trim()) { this.shake = 1; Audio_.sfx('wrong'); return; }
      Player.name = this.value.trim();
      Audio_.sfx('ok');
      Game.startNewGame();
    }
  },
  draw() {
    rect(0, 0, W, H, '#08080c');
    textCentered('WHAT IS YOUR NAME?', W / 2, 22, '#cfe0e8');
    const sx = this.shake > 0 ? Math.round((Math.random() - 0.5) * 5) : 0;
    const shown = this.value || '';
    rect(W / 2 - 46 + sx, 38, 92, 15, '#101018');
    rect(W / 2 - 46 + sx, 38, 92, 1, '#8fa8b4'); rect(W / 2 - 46 + sx, 52, 92, 1, '#8fa8b4');
    textCentered(shown + (Math.sin(Time.t * 5) > 0 ? '_' : ' '), W / 2 + sx, 42, '#f0ece2');
    if (this.shake > 0) textCentered('IT NEEDS A NAME.', W / 2, 58, '#c05a5a');

    const gx = W / 2 - 68, gy = 76;
    for (let r = 0; r < 3; r++) {
      for (let c = 0; c < 10; c++) {
        const ch = this.rows[r][c];
        const x = gx + c * 14, y = gy + r * 14;
        const sel = (r === this.cy && c === this.cx);
        if (sel) rect(x - 3, y - 3, 13, 13, '#2a3a48');
        text(ch, x, y, sel ? '#f0ece2' : '#9a9aa4');
      }
    }
    textCentered('Z ADD    X DELETE    C CONFIRM', W / 2, H - 20, '#5a5a66');
    grain(0.04);
  },
};

// --- pause menu --------------------------------------------------------
const Menu = {
  open: false, tab: 0, cursor: 0, rep: {}, tabs: ['STATUS', 'BAG', 'NOTES', 'OPTIONS'],
  toggle() { this.open = !this.open; this.cursor = 0; Audio_.sfx(this.open ? 'ok' : 'cancel'); },
  update(dt) {
    if (Input.hit('menu') || Input.hit('no')) { this.toggle(); return; }
    if (Input.repeat('left', this.rep)) { this.tab = (this.tab + 3) % 4; this.cursor = 0; Audio_.sfx('blip'); }
    if (Input.repeat('right', this.rep)) { this.tab = (this.tab + 1) % 4; this.cursor = 0; Audio_.sfx('blip'); }
    if (this.tab === 3 && Input.hit('ok')) {
      this.open = false; Options.enter('field'); Game.mode = 'options'; Audio_.sfx('ok'); return;
    }
    const list = this.list();
    if (list.length) {
      if (Input.repeat('up', this.rep)) { this.cursor = (this.cursor - 1 + list.length) % list.length; Audio_.sfx('blip'); }
      if (Input.repeat('down', this.rep)) { this.cursor = (this.cursor + 1) % list.length; Audio_.sfx('blip'); }
      if (Input.hit('ok') && this.tab === 2) {
        const note = list[this.cursor];
        Audio_.sfx('ok');
        this.open = false;
        Dialogue.say(NOTES[note].pages.map(t => ({ text: t, speaker: 'system' })));
      }
    }
  },
  list() {
    if (this.tab === 1) return Object.keys(Player.bag);
    if (this.tab === 2) return Player.notes;
    return [];
  },
  draw() {
    rect(0, 0, W, H, 'rgba(4,4,8,0.88)');
    for (let i = 0; i < 4; i++) {
      const x = 10 + i * 76;
      if (i === this.tab) rect(x - 4, 8, 70, 12, '#1e2630');
      text(this.tabs[i], x, 11, i === this.tab ? '#f0ece2' : '#70707c');

    rect(8, 22, W - 16, 1, '#3a3a44');

    if (this.tab === 0) {
      const rows = [
        ['NAME', Player.name], ['LEVEL', Player.level],
        ['HP', `${Player.hp} / ${Player.maxHp}`],
        ['PP', `${Player.pp} / ${Player.maxPp}`],
        ['SP', `${Player.sp} / ${Player.maxSp}`],
        ['ATK', Player.atk], ['SPATK', Player.spatk],
        ['DEF', Player.def], ['SPDEF', Player.spdef], ['SPD', Player.spd],
        ['RELL', Player.money],
        ['EXP', `${Player.exp} / ${Player.expToReach(Player.level + 1)}`],
        ['FOUND', `${Player.collectibles} / 10`],
      ];
      for (let i = 0; i < rows.length; i++) {
        const x = i < 7 ? 14 : W / 2 + 6, y = 30 + (i % 7) * 11;
        text(rows[i][0], x, y, '#8a8a94');
        text(String(rows[i][1]), x + 52, y, '#e8e8ee');
      }
    } else if (this.tab === 3) {
      text('PRESS Z TO OPEN OPTIONS.', 14, 32, '#9a9aa4');
    } else {
      const list = this.list();
      if (!list.length) {
        text(this.tab === 1 ? 'NOTHING IN THE BAG.' : 'NOTHING READ YET.', 14, 32, '#70707c');
      }
      for (let i = 0; i < Math.min(11, list.length); i++) {
        const y = 30 + i * 11;
        const name = this.tab === 1 ? list[i] : NOTES[list[i]].title;

    text('C / X  CLOSE', W - textWidth('C / X  CLOSE') - 10, H - 12, '#5a5a66');
  },
};

// --- shop --------------------------------------------------------------
const Shop = {
  open: false, cursor: 0, rep: {}, stock: [],
  start(stock) { this.open = true; this.stock = stock; this.cursor = 0; },
  update(dt) {
    if (Input.hit('no') || Input.hit('menu')) { this.open = false; Audio_.sfx('cancel'); return; }
    if (Input.repeat('up', this.rep)) { this.cursor = (this.cursor - 1 + this.stock.length) % this.stock.length; Audio_.sfx('blip'); }
    if (Input.repeat('down', this.rep)) { this.cursor = (this.cursor + 1) % this.stock.length; Audio_.sfx('blip'); }
    if (Input.hit('ok')) {
      const name = this.stock[this.cursor];
      const it = DATA.items[name];
      if (Player.money >= it.price) {
        Player.money -= it.price; Player.addItem(name);
        Audio_.sfx('found');
      } else Audio_.sfx('wrong');
    }
  },
  draw() {
    rect(0, 0, W, H, 'rgba(4,4,8,0.9)');
    text('OKOBO', 14, 10, '#f0ece2');
    text('RELL ' + Player.money, W - textWidth('RELL ' + Player.money) - 12, 10, '#e8d24a');
    rect(8, 22, W - 16, 1, '#3a3a44');
    for (let i = 0; i < this.stock.length; i++) {
      const name = this.stock[i], it = DATA.items[name], y = 32 + i * 12;
      const afford = Player.money >= it.price;
      text(name, 22, y, i === this.cursor ? '#f0ece2' : (afford ? '#9a9aa4' : '#5f5f68'));
      text(String(it.price), W - 60, y, afford ? '#b8b8c2' : '#5f5f68');
      text('x' + (Player.bag[name] || 0), W - 30, y, '#70707c');
      if (i === this.cursor) text('>', 12, y, '#e8d24a');
    }
    const sel = DATA.items[this.stock[this.cursor]];
    if (sel) text(wrap(sel.effect || '', W - 28)[0], 14, H - 26, '#8a8a94');
    text('Z BUY    X LEAVE', 14, H - 14, '#5a5a66');
  },
};

// --- fade / transitions ------------------------------------------------
const Fade = {
  a: 0, dir: 0, cb: null, hold: 0,
  out(cb, speed = 2.4) { this.dir = speed; this.cb = cb; },
  update(dt) {
    if (!this.dir) return;
    this.a += this.dir * dt;
    if (this.dir > 0 && this.a >= 1) {
      this.a = 1; this.dir = 0;
      const c = this.cb; this.cb = null;
      if (c) c();
      this.dir = -2.4;
    }
    if (this.dir < 0 && this.a <= 0) { this.a = 0; this.dir = 0; }
  },
  draw() { if (this.a > 0) { cx.globalAlpha = Math.min(1, this.a); rect(0, 0, W, H, '#000'); cx.globalAlpha = 1; } },
  get busy() { return this.dir !== 0 || this.a > 0.02; },
};


// ===== 70_game.js ================================================
// ---------------------------------------------------------------- content & game loop
// Story triggers, NPC dialogue, notes, and the state machine that runs them.
// Nobody in Okobo ever asks the player a question.

const NOTES = {
  ration_card: {
    title: 'RATION CARD',
    pages: [
      'LIMPO DOMESTIC ALLOTMENT - BOOK 9. Household of four. Expires end of season.',

    pages: ['If the water goes down, this is where the good tree was.'],
  },

const SHOP_STOCK = ['Spray', 'Clean Rag'];

// --- NPC lines ---------------------------------------------------------
// Limpo villagers attach a redundant location to statements about time.
// Nobody asks the player anything.
const NPCS = {
  okobo_woman: () => {
    if (Player.flags.wellDone) {
      return ['Oh - you got it. That is the bucket, alright.',
              'Back-when, over in the spring, that rope was new.'];
    }

    }
    if (Player.flags.wellQuest) {
      return ['It is down the well. That is rather the problem with it.'];
    }
    Player.flags.wellQuest = true;
    return ['Oh, you are the one who came down the hill.',
            'Everyone said someone came down the hill.',
            'Well. Welcome down, then.',
            'Say - the well bucket went in the well. Rope broke, later-on, up in the morning.',
            'If you are going past it anyway.'];
  },
  okobo_man: () => ([
    'You will want the well if you are thirsty. Middle of town, cannot miss it.',
    'Rope is broken, back-when, but the water is fine.',
    'Limpo? You are standing in it. Well - Okobo is in it, and it is in Limpo.',
    'Same thing from far enough off.',
  ]),
  okobo_child: () => ([
    'Are you staying? Everybody is leaving.',
    'Not in a bad way. Just - later-on, up in the spring, mostly.',
  ]),
  okobo_elder: () => ([
    'It has been thin here a long while. Two hundred years of thin.',
    'You get used to which fields you do not bother with.',
    'Over east they do alright. They have been doing alright at us for a while now.',
  ]),
  innkeeper: () => ([
    'Bed is there if you want it. No charge. Nobody else is using it.',
  ]),
  shopkeeper: () => ([
    'Haven\'t seen you. That is alright, I do not see everyone.',
  ]),
  hess: () => {
    if (Player.flags.letterDone) {
      return ['Thank you for going. I know what is out there.',
              'I wanted someone to go anyway.'];
    }
    if (Player.flags.letterDelivered) {
      Player.flags.letterDelivered = false; Player.flags.letterDone = true;
      Player.money += 200;
      return ['You went all the way out. There is nothing there, is there.',
              'No. I knew that.',
              'Take this. Please.',
              '(Got 200 Rell.)'];
    }
    if (Player.flags.letterQuest) {
      return ['North road. Past the trees. The address is out that way.'];
    }
    Player.flags.letterQuest = true;
    return ['You are going north? Take this, if you are.',
            'It is for my brother. The address is on the north road.',
            'He went off. Later-on, up in the spring. That was some springs ago now.',
            '(Got a letter.)'];
  },
