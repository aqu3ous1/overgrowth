<title>Overgrowth</title>

<style>
  /* Committed to a single dark world on purpose: the game is underlit, its
     corners go to actual black, and a light ground would fight every frame of
     it. The page is the cabinet the screen sits in. */
  :root {
    color-scheme: dark;
    --ground: #07070a;      /* near-black, faint blue bias — the void */
    --surface: #0d0d11;
    --hairline: #1c1c24;
    --ink: #d8d4c8;         /* the game's text colour */
    --ink-dim: #6e6e79;     /* cool-biased grey, not neutral */
    --ink-faint: #3a3a44;
    --grass: #6f9247;       /* the one accent: grass where it shouldn't be */
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--ground);
    color: var(--ink-dim);
    font: 400 13px/1.6 ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding: 28px 16px 36px;
    /* grass, bleeding up from under the building */
    background-image:
      radial-gradient(120% 60% at 50% 118%, rgba(111, 146, 71, 0.10), transparent 62%);
  }

  header { display: flex; flex-direction: column; align-items: center; gap: 9px; }

  /* The wordmark is drawn with the game's own 5x7 bitmap font, at 4x.
     No webfont, no image — the chrome and the game share a typeface. */
  #wordmark { display: block; height: 30px; image-rendering: pixelated; }

  .tagline {
    font-size: 10px;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 0;
    padding-left: 0.34em;
  }

  #wrap { width: 100%; max-width: 960px; }

  canvas#screen {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 16 / 9;
    image-rendering: pixelated;
    background: #000;
    border: 1px solid var(--hairline);
    box-shadow:
      0 0 0 1px rgba(0, 0, 0, 0.6),
      0 24px 60px -28px rgba(0, 0, 0, 0.95),
      0 0 90px -50px rgba(111, 146, 71, 0.5);
    touch-action: none;
    outline: none;
  }
  canvas#screen:focus-visible { border-color: var(--grass); }

  footer {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 7px 14px;
    max-width: 720px;
  }

  kbd {
    display: inline-block;
    min-width: 22px;
    padding: 3px 6px;
    border: 1px solid var(--hairline);
    border-bottom-width: 2px;
    border-radius: 3px;
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    font-size: 11px;
    line-height: 1.1;
    text-align: center;
  }

  .key { display: inline-flex; align-items: baseline; gap: 6px; white-space: nowrap; }
  .key span { font-size: 11px; letter-spacing: 0.06em; }

  .meta {
    display: flex;
    gap: 10px;
    align-items: center;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .meta b { color: var(--ink-dim); font-weight: 400; }

  #audio-note { color: var(--ink-faint); }
  #audio-note[data-on="1"] { color: var(--grass); }

  @media (max-width: 560px) {
    body { gap: 16px; padding: 16px 10px 24px; }
    #wordmark { height: 22px; }
    .tagline { font-size: 9px; letter-spacing: 0.26em; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>

<header>
  <canvas id="wordmark" width="600" height="60" role="img" aria-label="Overgrowth"></canvas>
  <p class="tagline">One kid &middot; one long walk out</p>
</header>

<div id="wrap">
  <canvas id="screen" width="320" height="180" tabindex="0"
          aria-label="Overgrowth game screen"></canvas>
</div>

<footer>
  <span class="key"><kbd>&larr;</kbd><kbd>&uarr;</kbd><kbd>&darr;</kbd><kbd>&rarr;</kbd><span>move</span></span>
  <span class="key"><kbd>Z</kbd><span>confirm</span></span>
  <span class="key"><kbd>X</kbd><span>cancel</span></span>
  <span class="key"><kbd>C</kbd><span>menu</span></span>
</footer>

<div class="meta">
  <span>0.1.0</span><span>&middot;</span><span>Vertical slice</span><span>&middot;</span>
  <span id="audio-note">Click the screen for sound</span>
</div>

<script>
//<<<GAME>>>

// The wordmark, set in the game's own bitmap font. Same glyph table the text
// boxes use, drawn at 4x with a little tracking.
(function drawWordmark() {
  const wm = document.getElementById('wordmark');
  const g = wm.getContext('2d');
  const word = 'OVERGROWTH', scale = 4, track = 3;
  const w = word.length * (FONT_W + track) * scale;
  wm.width = w; wm.height = FONT_H * scale + 8;
  g.imageSmoothingEnabled = false;
  g.fillStyle = '#d8d4c8';
  let x = 0;
  for (const ch of word) {
    const rows = GLYPH_CACHE[ch];
    for (let r = 0; r < FONT_H; r++)
      for (let c = 0; c < FONT_W; c++)
        if (rows[r][c] === '1') g.fillRect((x + c) * scale, r * scale + 4, scale, scale);
    x += FONT_W + track;
  }
  // one blade of grass through the mark, because that is the whole idea
  g.fillStyle = '#6f9247';
  g.fillRect(0, wm.height - 3, w, 1);
})();

document.getElementById('screen').focus();
</script>
